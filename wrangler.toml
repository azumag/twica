# Cloudflare Workers configuration for TwiCa
# TwiCa用 Cloudflare Workers 設定

name = "twica"
main = ".open-next/worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# Distributed rate limiting, maintenance EventSub parking, and short-lived OBS
# demo events share this namespace with disjoint key prefixes.
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "2dadcd9aa89b466d9c860a8930d458fa"
preview_id = "6604c73cdb474d6a8a50b8afd4076d5f"

# Production image and sound storage. `preview_bucket_name` is used by local
# preview execution; the explicit [env.preview] declarations below are used by
# the separately deployed twica-preview Worker.
[[r2_buckets]]
binding = "R2_IMAGES"
bucket_name = "twica-prod"
preview_bucket_name = "twica-dev"

[[r2_buckets]]
binding = "R2_SOUNDS"
bucket_name = "twica-sound-prod"
preview_bucket_name = "twica-sound-dev"

# Authoritative production PostgreSQL connection. The retired Supabase
# Hyperdrive binding was removed so a stale DB target cannot open the old
# project after shutdown. Query caching remains disabled on the referenced
# Hyperdrive config to preserve event-polling freshness.
[[hyperdrive]]
binding = "HYPERDRIVE_PLANETSCALE"
id = "1dc2ec4d087e41a6931e8e18944c1fd2"
localConnectionString = "postgres://user:password@localhost:5432/postgres"

# Public value that must survive dashboard-only configuration overwrites.
[vars]
NEXT_PUBLIC_TWITCH_CLIENT_ID = "okxjgv064gr80kcijf1b0e182x394o"

# Server secrets are configured with `wrangler secret put` or in the
# Cloudflare dashboard. NEXT_PUBLIC_* build-time values are supplied by Workers
# Builds / CI. `src/lib/env-validation.ts` is the canonical required-variable
# list.

# ============================================================
# Preview Worker (twica-preview)
# ============================================================
# [env.preview] replaces, rather than merges, binding arrays. KV/R2/Hyperdrive
# are therefore redeclared explicitly.

[env.preview]

[env.preview.observability]
enabled = true

[env.preview.vars]
NEXT_PUBLIC_TWITCH_CLIENT_ID = "k40qdqew0buz3cjshwp6fbr5pmuayw"

[[env.preview.kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "6604c73cdb474d6a8a50b8afd4076d5f"

[[env.preview.r2_buckets]]
binding = "R2_IMAGES"
bucket_name = "twica-dev"

[[env.preview.r2_buckets]]
binding = "R2_SOUNDS"
bucket_name = "twica-sound-dev"

# Authoritative preview PostgreSQL connection.
# The previous config was deleted after its stale direct sessions exhausted the
# PlanetScale connection limit. Keep this preview-only config capped at five
# origin connections so preview validation cannot starve production traffic.
[[env.preview.hyperdrive]]
binding = "HYPERDRIVE_PLANETSCALE"
id = "5caf2d40d4f04fc49bc47053ab47ec22"
localConnectionString = "postgres://user:password@localhost:5432/postgres"
