# Cloudflare Pages configuration for TwiCa
# TwiCa用のCloudflare Pages設定
#
# This file configures the Cloudflare Workers runtime for the Next.js app
# when deployed to Cloudflare Pages.
#
# このファイルはCloudflare Pagesにデプロイされた際の
# Next.jsアプリのCloudflare Workersランタイムを設定します。

name = "twica"
# OpenNext generates the worker entry point at .open-next/worker.js after running `workers:build`
# OpenNextが`workers:build`実行後に .open-next/worker.js にワーカーエントリポイントを生成する
main = ".open-next/worker.js"
# Must be 2024-09-23 or later to resolve bare Node.js built-in imports (e.g. require("fs"))
# without the "node:" prefix. Required by Next.js server bundle generated by OpenNext.
# ベアなNode.js組み込みモジュールのimport（例: require("fs")）を解決するには
# 2024-09-23以降が必要。OpenNextが生成するNext.jsサーバーバンドルで必須。
compatibility_date = "2024-09-23"

# Enable Node.js compatibility mode for crypto and other Node.js APIs
# cryptoやその他のNode.js APIのためにNode.js互換モードを有効化
compatibility_flags = ["nodejs_compat"]

# Observability (Workers Logs, Traces)
# wrangler tail やダッシュボードでリアルタイムにログ・トレースを確認可能
# Enables real-time log streaming and traces via wrangler tail and dashboard
[observability]
enabled = true

# Static assets directory generated by OpenNext build
# OpenNextビルドで生成される静的アセットディレクトリ
[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# KV Namespace binding for distributed rate limiting
# 分散レート制限用のKV名前空間バインディング
#
# To create and bind KV namespaces:
# KV名前空間の作成とバインドの手順:
#
# 1. Create the KV namespace:
#    wrangler kv:namespace create "RATE_LIMIT_KV"
#
# 2. Copy the id from the output and paste below
#    出力からidをコピーして以下に貼り付け
#
# 3. For preview/development, also create a preview namespace:
#    wrangler kv:namespace create "RATE_LIMIT_KV" --preview
#
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "2dadcd9aa89b466d9c860a8930d458fa"
preview_id = "6604c73cdb474d6a8a50b8afd4076d5f"

# R2 Bucket bindings for image and sound storage
# 画像・効果音ストレージ用のR2バケットバインディング
#
# Production uses twica-prod / twica-sound-prod,
# preview (wrangler dev / --env preview) uses twica-dev / twica-sound-dev.
# preview_bucket_name によりデプロイ環境ごとに自動切り替え。
#
# 本番環境は twica-prod / twica-sound-prod を使用し、
# プレビュー環境は twica-dev / twica-sound-dev を使用する。
[[r2_buckets]]
binding = "R2_IMAGES"
bucket_name = "twica-prod"
preview_bucket_name = "twica-dev"

[[r2_buckets]]
binding = "R2_SOUNDS"
bucket_name = "twica-sound-prod"
preview_bucket_name = "twica-sound-dev"

# ============================================================
# Hyperdrive binding for direct Postgres access (#570, #568 Phase 1)
# Postgres 直結アクセス用 Hyperdrive バインディング (#570, #568 Phase 1)
# ============================================================
#
# DB_DRIVER=pg-read/pg で有効になる新データアクセス経路（postgres.js + Drizzle）が
# 使用する。フラグ未設定の間はコードから参照されないため、このバインディングが
# 無くてもデプロイ・動作に影響はない（安全にコメントアウトのまま置ける）。
#
# 作成手順（リポジトリオーナーが実行）:
#   wrangler hyperdrive create twica-hyperdrive-prod \
#     --connection-string="<本番 Supabase の Direct connection 文字列>" \
#     --caching-disabled
#
# --caching-disabled が必須である理由:
#   Hyperdrive のクエリキャッシュはデフォルト有効（max_age 60s）。Phase 1 は
#   PostgREST（毎回実クエリ）との完全パリティが目的であり、キャッシュが有効だと
#   overlay ポーリングの新着イベントが最大 60 秒遅延する等の挙動差が出るため。
#
# localConnectionString は `wrangler dev` 実行時のみ使われるローカル接続先
# （next dev は process.env.DATABASE_URL を使う。docs/db-driver-migration.md 参照）。

[[hyperdrive]]
binding = "HYPERDRIVE"
id = "38f11f06161c4c538694522e4ede74f5"
localConnectionString = "postgres://user:password@localhost:5432/postgres"

# Environment variables that must survive deploys (Dashboard-only vars get overwritten)
# デプロイ時に上書きされないよう、Dashboard のみで設定していた変数をここに明示する
[vars]
NEXT_PUBLIC_TWITCH_CLIENT_ID = "okxjgv064gr80kcijf1b0e182x394o"

# Environment variables are configured via Cloudflare secrets / dashboard, not
# by adding entries to this file (the [vars] block above is the one exception,
# kept here specifically so it survives Dashboard-only overwrites).
# 環境変数はこのファイルに追記するのではなく Cloudflare Secrets /
# ダッシュボードで設定する（上の [vars] は Dashboard 専用設定の上書きに
# 対抗するための唯一の例外）。
#
# Canonical list (#536): the actual runtime source of truth for which
# environment variables are required is `src/lib/env-validation.ts`
# (`requiredEnvVars` / `requiredEnvVarGroups`), which throws at startup if any
# are missing. Do not maintain a second hand-written list here — a prior
# version of this comment drifted out of sync with env-validation.ts and
# became misleading. Check that file, not this comment, for what is actually
# required.
# 必須環境変数の正本(#536): 実際にランタイムで何が必須かは
# `src/lib/env-validation.ts` の `requiredEnvVars` / `requiredEnvVarGroups`
# （起動時に不足があると例外を投げる）。ここに別の手書きリストを維持しない
# （以前のコメントは env-validation.ts と乖離してしまっていた）。必須項目は
# このコメントではなく同ファイルを参照すること。
#
# Wrangler-specific operational note: server-side / non-NEXT_PUBLIC_* secrets
# are set with `wrangler secret put <NAME>` (or the Cloudflare dashboard) —
# never commit them to this file. `NEXT_PUBLIC_*` build-time vars are supplied
# by Cloudflare Workers Builds / the CI build step (see
# docs/cloudflare-workers-builds.md), not by [vars] here, so production and
# preview can use different values without editing this file.
# Wrangler固有の運用メモ: サーバー側（非NEXT_PUBLIC_*）のシークレットは
# `wrangler secret put <NAME>`（またはCloudflareダッシュボード）で設定し、
# このファイルにはコミットしない。`NEXT_PUBLIC_*` のビルド時変数は
# Cloudflare Workers Builds / CIビルドステップから供給される
# (docs/cloudflare-workers-builds.md 参照) ため、[vars] ではなく本番/
# プレビューで異なる値を、このファイルを編集せずに持てる。
#
# Note: R2_ENDPOINT, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY are no longer needed
# in Workers environment (R2 is accessed via native bindings above).
# These are still needed for local development with `next dev`.
# 注意: R2_ENDPOINT, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY は
# Workers環境では不要（上記のネイティブバインディング経由でR2にアクセス）。
# `next dev` でのローカル開発では引き続き必要。

# ============================================================
# Preview environment configuration
# プレビュー環境設定
# ============================================================
#
# Deployed as a separate Worker named "twica-preview" via:
#   npm run workers:deploy:preview
#
# [env.preview] overrides (not merges) the top-level bindings,
# so all KV and R2 bindings must be explicitly re-declared here.
# [env.preview] はトップレベルのバインディングをマージではなく上書きするため、
# KV・R2 すべてを明示的に再宣言する必要がある。
#
# compatibility_date, compatibility_flags, [assets] are inherited
# from the top-level configuration automatically.
# compatibility_date, compatibility_flags, [assets] はトップレベルから自動継承される。
[env.preview]

# Observability for preview environment
# プレビュー環境でもログ・トレースを有効化
[env.preview.observability]
enabled = true

# Preview environment uses a separate Twitch application for isolation
# プレビュー環境は本番と異なるTwitchアプリケーションを使用する
[env.preview.vars]
NEXT_PUBLIC_TWITCH_CLIENT_ID = "k40qdqew0buz3cjshwp6fbr5pmuayw"

# KV Namespace for rate limiting in preview environment
# プレビュー環境用レート制限KV名前空間（トップレベルの preview_id と同じ値）
[[env.preview.kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "6604c73cdb474d6a8a50b8afd4076d5f"

# R2 Bucket for image storage in preview environment (twica-dev)
# プレビュー環境用画像ストレージR2バケット（twica-dev）
[[env.preview.r2_buckets]]
binding = "R2_IMAGES"
bucket_name = "twica-dev"

# R2 Bucket for sound effect storage in preview environment (twica-sound-dev)
# プレビュー環境用効果音ストレージR2バケット（twica-sound-dev）
[[env.preview.r2_buckets]]
binding = "R2_SOUNDS"
bucket_name = "twica-sound-dev"

# Hyperdrive binding for preview environment (#570)
# プレビュー環境用 Hyperdrive バインディング (#570)
#
# [env.preview] はトップレベルのバインディングをマージではなく上書きするため、
# （KV・R2 と同様）Hyperdrive も preview 側に明示的な再宣言が必要。
# preview 用は別の Hyperdrive config（preview プロジェクトの Supabase に接続）を作る:
#   wrangler hyperdrive create twica-hyperdrive-preview \
#     --connection-string="<preview Supabase の Direct connection 文字列>" \
#     --caching-disabled
# --caching-disabled 必須の理由・id 記入ルールはトップレベルの [[hyperdrive]] コメント参照。

[[env.preview.hyperdrive]]
binding = "HYPERDRIVE"
id = "1e3f6c4569bf4202a41c42711c878b86"
localConnectionString = "postgres://user:password@localhost:5432/postgres"
