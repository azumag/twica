# Cloudflare Workers configuration for TwiCa
# TwiCa用 Cloudflare Workers 設定

name = "twica"
main = ".open-next/worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# 2026-08-08時点のCloudflare直近7日計測はCPU P999が372ms、CPU超過が0件。P999の約2.7倍に
# 当たる1000msなら観測tailへ余裕を残しつつ、既定30秒より暴走範囲を縮小できる。
# cpu_msは実CPU時間の上限であり、外部I/OやDB応答を待つwall timeは含まれない。
[limits]
cpu_ms = 1000

# Issue #906: 高頻度ポーリングAPI（/api/maintenance-status）のCPU削減のため、
# Workers Cache（HTTPエッジキャッシュ）を有効化する。HIT時はWorkerが実行されず
# CPU課金ゼロになる。キャッシュ対象は middleware の CACHEABLE_PUBLIC_PATHS に
# 明示したパスのみ（fail-closed: それ以外は private, no-store をデフォルト付与）。
# 注意:
# - 静的アセットリクエストは「無料」から「リクエスト課金」に変わる（有効化前後の
#   請求・Analytics を比較して確認すること）。
# - サービスバインディング呼び出し（OVERLAY_REALTIME_SERVICE）も標準レートで
#   課金化される。
# - [env.preview] はこの [cache] 設定を継承する（preview でもキャッシュが効く）。
[cache]
enabled = true

[observability]
enabled = true

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# Distributed rate limiting, maintenance EventSub parking, short-lived OBS
# demo events, the Twitch app token cache (`twitch:app-token`), and the live
# directory cache (`live-directory:v1`) share this namespace with disjoint key
# prefixes.
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "2dadcd9aa89b466d9c860a8930d458fa"
preview_id = "6604c73cdb474d6a8a50b8afd4076d5f"

# Production image and sound storage. `preview_bucket_name` is used by local
# preview execution; the explicit [env.preview] declarations below are used by
# the separately deployed twica-preview Worker.
[[r2_buckets]]
binding = "R2_IMAGES"
bucket_name = "twica-prod"
preview_bucket_name = "twica-dev"

[[r2_buckets]]
binding = "R2_SOUNDS"
bucket_name = "twica-sound-prod"
preview_bucket_name = "twica-sound-dev"

# Authoritative production PostgreSQL connection. The retired Supabase
# Hyperdrive binding was removed so a stale DB target cannot open the old
# project after shutdown. Query caching remains disabled on the referenced
# Hyperdrive config to preserve event-polling freshness. Its external
# origin_connection_limit is intentionally 10; together with preview's 5 this
# remains below PlanetScale's 25 direct-connection ceiling and leaves headroom
# because Cloudflare documents the Hyperdrive limit as a soft maximum.
[[hyperdrive]]
binding = "HYPERDRIVE_PLANETSCALE"
id = "1dc2ec4d087e41a6931e8e18944c1fd2"
localConnectionString = "postgres://user:password@localhost:5432/postgres"

# Cloudflare blocks global fetch() from one Worker to another Worker on the
# same zone. Bind the realtime publisher directly so signed gacha events stay
# on Cloudflare's internal path and never depend on workers.dev routing.
[[services]]
binding = "OVERLAY_REALTIME_SERVICE"
service = "twica-overlay-realtime"

# Public value that must survive dashboard-only configuration overwrites.
[vars]
NEXT_PUBLIC_TWITCH_CLIENT_ID = "okxjgv064gr80kcijf1b0e182x394o"

# Server secrets are configured with `wrangler secret put` or in the
# Cloudflare dashboard. NEXT_PUBLIC_* build-time values are supplied by Workers
# Builds / CI. `src/lib/env-validation.ts` is the canonical required-variable
# list.

# ============================================================
# Preview Worker (twica-preview)
# ============================================================
# [env.preview] replaces, rather than merges, binding arrays. KV/R2/Hyperdrive
# are therefore redeclared explicitly.

[env.preview]

[env.preview.observability]
enabled = true

[env.preview.vars]
NEXT_PUBLIC_TWITCH_CLIENT_ID = "k40qdqew0buz3cjshwp6fbr5pmuayw"

[[env.preview.kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "6604c73cdb474d6a8a50b8afd4076d5f"

[[env.preview.r2_buckets]]
binding = "R2_IMAGES"
bucket_name = "twica-dev"

[[env.preview.r2_buckets]]
binding = "R2_SOUNDS"
bucket_name = "twica-sound-dev"

# Authoritative preview PostgreSQL connection.
# The previous config was deleted after its stale direct sessions exhausted the
# PlanetScale connection limit. Keep this preview-only config capped at five
# origin connections so preview validation cannot starve production traffic.
[[env.preview.hyperdrive]]
binding = "HYPERDRIVE_PLANETSCALE"
id = "5caf2d40d4f04fc49bc47053ab47ec22"
localConnectionString = "postgres://user:password@localhost:5432/postgres"

[[env.preview.services]]
binding = "OVERLAY_REALTIME_SERVICE"
service = "twica-overlay-realtime-preview"
