name: One-off patch issue 1002 overlay recovery

on:
  push:
    branches:
      - fix/1002-overlay-queue-recovery

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/1002-overlay-queue-recovery
          fetch-depth: 0

      - name: Make queue recovery independent from diagnostics
        run: |
          python3 - <<'PY'
          from pathlib import Path

          page = Path('src/app/overlay/[streamerId]/page.tsx')
          text = page.read_text(encoding='utf-8')
          old = (
              '    const handleQueueError = (error: unknown) => {\n'
              '      logger.error("Error processing gacha display queue:", error);\n'
              '      addDebugLogRef.current(\n'
              '        `processQueue error: ${error instanceof Error ? error.message : String(error)}`\n'
              '      );\n'
              '      // If this item never committed, tell the transport to retry it instead\n'
              '      // of permanently deduplicating a draw that the viewer could not see.\n'
              '      settleDisplayCommit(next.displayInstanceId, false);\n'
              '      // ロックを握ったまま関数を抜けないよう、失敗したカードは諦めて\n'
              '      // 残りのキューを継続する。キューが尽きていれば冒頭の `if (!next)`\n'
              '      // 分岐でロックが解放される。\n'
              '      setTimeout(() => processQueueRef.current(), 0);\n'
              '    };'
          )
          new = (
              '    const handleQueueError = (error: unknown) => {\n'
              '      // Recovery is the primary contract. Arm it before diagnostics so a\n'
              '      // broken logger/debug panel cannot leave the display lock stuck. Keep\n'
              '      // the timeout in the tracked ref so lifecycle cleanup can cancel an old\n'
              '      // subscription\'s recovery before a newer queue starts.\n'
              '      animationTimeoutRef.current = setTimeout(() => {\n'
              '        animationTimeoutRef.current = null;\n'
              '        if (\n'
              '          !isOverlayMountedRef.current\n'
              '          || queueGeneration !== queueGenerationRef.current\n'
              '        ) {\n'
              '          return;\n'
              '        }\n'
              '        processQueueRef.current();\n'
              '      }, 0);\n'
              '\n'
              '      // If this item never committed, tell the transport to retry it instead\n'
              '      // of permanently deduplicating a draw that the viewer could not see.\n'
              '      settleDisplayCommit(next.displayInstanceId, false);\n'
              '      // A presentation error may happen after the card became visible but\n'
              '      // before the normal hide chain was scheduled. Remove that failed card\n'
              '      // immediately so an empty queue cannot leave it on screen indefinitely.\n'
              '      imageLayoutGenerationRef.current += 1;\n'
              '      activeDisplayInstanceIdRef.current = undefined;\n'
              '      setShowCard(false);\n'
              '      setResult(null);\n'
              '      setImageFallbackDisplayInstanceId(null);\n'
              '      setActiveEffectStyle("none");\n'
              '      setEffectParticles([]);\n'
              '\n'
              '      try {\n'
              '        logger.error("Error processing gacha display queue:", error);\n'
              '      } catch {\n'
              '        // Diagnostics are best-effort; the recovery timer above is authoritative.\n'
              '      }\n'
              '      try {\n'
              '        addDebugLogRef.current(\n'
              '          `processQueue error: ${error instanceof Error ? error.message : String(error)}`\n'
              '        );\n'
              '      } catch {\n'
              '        // Debug UI failures must not block the business-event queue either.\n'
              '      }\n'
              '    };'
          )
          if text.count(old) != 1:
              raise SystemExit('handleQueueError target was not unique')
          page.write_text(text.replace(old, new), encoding='utf-8')

          test = Path('tests/unit/components/overlay-page.test.tsx')
          text = test.read_text(encoding='utf-8')
          old = "import OverlayPage from '@/app/overlay/[streamerId]/page'\n"
          new = old + "import { logger } from '@/lib/logger'\n"
          if text.count(old) != 1:
              raise SystemExit('logger import target was not unique')
          text = text.replace(old, new)

          old = (
              '    resolvePlayableGachaSoundMock.mockImplementationOnce(() => {\n'
              "      throw new Error('failure inside setTimeout chain')\n"
              '    })\n'
              '\n'
              '    act(() => {'
          )
          new = (
              '    resolvePlayableGachaSoundMock.mockImplementationOnce(() => {\n'
              "      throw new Error('failure inside setTimeout chain')\n"
              '    })\n'
              '    // handleQueueError must schedule recovery before diagnostics. Simulate a\n'
              '    // logger implementation failure to ensure it cannot strand the display lock.\n'
              "    const loggerErrorSpy = vi.spyOn(logger, 'error').mockImplementationOnce(() => {\n"
              "      throw new Error('diagnostic logger failed')\n"
              '    })\n'
              '\n'
              '    act(() => {'
          )
          if text.count(old) != 1:
              raise SystemExit('logger failure fixture target was not unique')
          text = text.replace(old, new)

          old = (
              '    expect(resolvePlayableGachaSoundMock).toHaveBeenCalled()\n'
              '\n'
              '    // 例外がhandleQueueErrorへ届いていれば、setTimeout(0)経由でロックが'
          )
          new = (
              '    expect(resolvePlayableGachaSoundMock).toHaveBeenCalled()\n'
              '    expect(loggerErrorSpy).toHaveBeenCalled()\n'
              '    // The normal hide chain was never scheduled, so handleQueueError itself\n'
              '    // must remove the failed card instead of leaving it visible indefinitely.\n'
              "    expect(screen.queryByText('TimerThrow')).not.toBeInTheDocument()\n"
              '\n'
              '    // 例外がhandleQueueErrorへ届いていれば、setTimeout(0)経由でロックが'
          )
          if text.count(old) != 1:
              raise SystemExit('failed card assertion target was not unique')
          text = text.replace(old, new)

          old = (
              "    expect(screen.getByText('RecoveredFromTimer')).toBeInTheDocument()\n"
              '  })'
          )
          new = (
              "    expect(screen.getByText('RecoveredFromTimer')).toBeInTheDocument()\n"
              '    loggerErrorSpy.mockRestore()\n'
              '  })'
          )
          if text.count(old) != 1:
              raise SystemExit('logger restore target was not unique')
          test.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Commit patch and remove one-off workflow
        run: |
          rm .github/workflows/patch-issue-1002-overlay-recovery.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'src/app/overlay/[streamerId]/page.tsx' tests/unit/components/overlay-page.test.tsx .github/workflows/patch-issue-1002-overlay-recovery.yml
          git commit -m "fix(overlay): queue回復を診断処理から独立させる" -m "Closes #1002"
          git push origin HEAD:fix/1002-overlay-queue-recovery
