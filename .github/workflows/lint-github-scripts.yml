name: GitHub helper scripts lint

on:
  push:
    branches: [main, preview]
    paths:
      - '.github/scripts/**/*.mjs'
      - '.github/scripts/**/*.py'
      - '.github/workflows/lint-github-scripts.yml'
      - 'eslint.config.mjs'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    branches: [main, preview]
    paths:
      - '.github/scripts/**/*.mjs'
      - '.github/scripts/**/*.py'
      - '.github/workflows/lint-github-scripts.yml'
      - 'eslint.config.mjs'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Check Python helper syntax
        run: python3 -m compileall -q .github/scripts

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Node 20 はサポート終了で 2026-10 のセキュリティ修正が出ないため、ビルド/CIと同じ
          # .node-version（修正版に完全固定）へ統一する。Refs #1914
          node-version-file: .node-version
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint GitHub helper scripts
        run: npx eslint .github/scripts
