name: One-off patch issue 1113 reopened QA docs

on:
  push:
    branches:
      - docs/1113-reopened-qa2

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/1113-reopened-qa2

      - name: Align QA docs with reopened trigger
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('docs/QA.md')
          text = path.read_text(encoding='utf-8')
          old = '- baseが`main`、headが`preview`のPRは、`opened`・`edited`・`synchronize`時のマージ前チェックでこの見出しの本文が空または欠落している場合に失敗させる。'
          new = '- baseが`main`、headが`preview`のPRは、`opened`・`reopened`・`edited`・`synchronize`時のマージ前チェックでこの見出しの本文が空または欠落している場合に失敗させる。'
          if text.count(old) != 1:
              raise SystemExit(f'expected one QA trigger sentence, got {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit docs and remove one-off workflow
        run: |
          rm .github/workflows/patch-1113-reopened-doc.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/QA.md .github/workflows/patch-1113-reopened-doc.yml
          git commit -m "docs(qa): reopened昇格PRの再検証を明記" -m "Refs #1113 #1303"
          git push origin HEAD:docs/1113-reopened-qa2
