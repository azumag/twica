name: Deploy Rate Limit Production Worker

# #1888: production Durable Object Worker (twica-rate-limit) is a new,
# billable Cloudflare resource. Deployment is therefore owner-gated:
# this workflow only runs via manual dispatch (no push / PR triggers),
# requires an exact confirm input, and stays inert until then.
# The preview counterpart lives in deploy-rate-limit.yml (#1987 / #1992).

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type 'deploy-production' to confirm deployment of the rate-limit production Worker"
        required: true
        type: string

concurrency:
  group: deploy-rate-limit-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event.inputs.confirm == 'deploy-production' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck rate-limit Worker
        run: npm run rate-limit:typecheck

      - name: Verify rate-limit production bundle (dry-run, no deploy)
        run: npm run rate-limit:build:production

      - name: Deploy rate-limit production Worker
        run: npm run rate-limit:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
