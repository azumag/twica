# Claude Auto Review (preview)
#
# preview をターゲットにした PR のたびに、Claude Code（モデル: opus）が追加された
# 変更を自動レビューし、PR コメントで指摘を報告する。
#
# 経緯: 旧版は `push: branches: [preview]` で発火していたが、
# anthropics/claude-code-action@v1 が push イベントに対応しておらず常時失敗して
# いたため、PR #915 で一時削除。本版は `pull_request` イベントへ変更して復活させる。
#
# 前提・リスク受容:
# - `CLAUDE_CODE_OAUTH_TOKEN` はオーナーが `claude setup-token` で発行し、
#   GitHub Secret を自身で差し替える（Action 側で値を読み書きしない）。
# - `pull_request` は PR ヘッド側のワークフロー定義で実行されるため、同一
#   リポジトリの write 権限保持者はこのワークフローを改変してトークンを取得
#   できる。より強い保護（environment + required reviewers）は PR ごとの承認が
#   要って自動レビューが機能しなくなるため受容する。
# - 実効的な封じ込めは「fork PR に secrets が渡らない」「Claude 実行 job は
#   read-only GITHUB_TOKEN」「投稿前にトークン伏字化 + 生トークン完全一致チェック」
#   の3点。--allowedTools / --disallowedTools は Bash の網羅的 allowlist ではなく
#   （部分一致で ls/cat 等も実行されうる）、curl/wget の deny は迂回可能な緩和に
#   過ぎない。@メンションの置換は意図的に行わない（write 権限保持者起点の注入は
#   受容済み。無条件置換はコード引用を壊す実害があるため）。
#
# Claude 実行 job と投稿 job を分離し、投稿用の pull-requests: write は Claude の
# 実行終了後にのみ使う。post_review も PR head 由来の .github/scripts/
# format-review.mjs を実行するが、workflow 定義自体が head 由来である以上
# 実効的な権限拡大はなく、fork では secrets が渡らず起動条件も満たされない。
# なおコメントは同一コメントを updateComment で上書きする（単一コメント維持
# 方針）ため、購読者への通知は発生しない。PR ページで確認する運用。
name: Claude Auto Review (preview)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [preview]
    # ドキュメントのみの変更では opus を回さない（コスト抑制）。ただし
    # AGENTS.md / CLAUDE.md はレビュー基準そのものなので対象から外さない。
    # paths は最後にマッチしたパターンが優先されるため、
    # 全ファイル含む → md 除外 → 上記2ファイル再含む、の順で書く。
    paths:
      - '**'
      - '!**/*.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
    # main 向け PR は対象外（preview でレビュー済みの内容を昇格するだけのため意図的）

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude_review:
    name: Review PR changes
    # draft PR では毎 push ごとに opus を回さない
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    outputs:
      review: ${{ steps.review.outputs.structured_output }}

    steps:
      - name: Check token configured
        id: check-token
        # job の env を outputs から参照するのは GitHub Actions のコンテキスト
        # 可用性の境界で壊れやすいため、step output 経由で確実に渡す。
        run: |
          configured=${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
          echo "configured=$configured" >> "$GITHUB_OUTPUT"
          if [ "$configured" != "true" ]; then
            echo "CLAUDE_CODE_OAUTH_TOKEN が未設定、または fork PR のため secrets が渡らないため、Claude 自動レビューはスキップされます。" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Checkout repository
        if: steps.check-token.outputs.configured == 'true'
        uses: actions/checkout@v4
        with:
          # three-dot diff (base...head) は merge-base 解決に双方の履歴が必要。
          # fetch-depth を絞ると base 側の commit が欠けて diff が失敗しうるため
          # 全履歴を取得する（チェックアウト時間と安全性のトレードオフ）。
          fetch-depth: 0
          persist-credentials: false
          # コンフリクト中の PR では refs/pull/N/merge が生成されず checkout が
          # 失敗するため、head SHA を明示する（three-dot diff には影響しない）。
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Claude Code Review (opus)
        id: review
        if: steps.check-token.outputs.configured == 'true'
        # 供給元タグの更新で挙動が変わり得るため、コミットSHAピンが定石だが、
        # この環境から GitHub API へ到達できず（api.github.com への疎通不可）
        # 現在の v1 タグの SHA を取得できないため、タグ運用を維持する。
        # OAuth トークンを渡す唯一の action なので、SHA 取得手段ができ次第
        # ピン化する（actionlint 導入時に対象にする）。
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Claude GitHub App の書き込み権限ではなく、この job の読み取り専用
          # GITHUB_TOKEN を明示的に使う。
          github_token: ${{ github.token }}
          prompt: |
            REPO: ${{ github.repository }}
            PR: #${{ github.event.pull_request.number }}
            BASE SHA: ${{ github.event.pull_request.base.sha }}
            HEAD SHA: ${{ github.event.pull_request.head.sha }}

            この PR で追加された変更を厳しくレビューしてください。
            対象は PR 全体の差分です。

            `git diff --find-renames ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}`

            必要に応じて `git log`、`git show`、関連ソースの読み取りで文脈を確認してください。
            `git diff` が失敗する場合（base が孤立している等）は、その旨を
            「レビュー不可」として明示してください。
            リポジトリの AGENTS.md がある場合はそれを読み、レビュー観点として従ってください。

            レビュー観点（AGENTS.md 準拠）:
            - コード品質とベストプラクティス
            - 潜在的なバグとエッジケース
            - パフォーマンスへの影響
            - セキュリティ考慮
            - コードの簡潔性（過度な抽象化・複雑化の回避）
            - 単体テストのカバレッジは十分か
            - YAGNI（過剰な実装と設計の回避）

            指摘は日本語で行い、具体的な問題にはファイルと行を明記してください。
            問題がない場合は「指摘なし」と明記してください。
            レビュー本文は日本語で 6000 字以内に収めてください。
            コードやGitHub上の状態は変更せず、レビュー本文だけを返してください。
            最終回答は指定されたJSON SchemaのreviewフィールドにMarkdownで格納してください。
          claude_args: >-
            --model opus
            --max-turns 30
            --allowedTools "Bash(git diff:*),Bash(git log:*),Bash(git show:*),Read,Grep,Glob"
            --disallowedTools "Edit,Write,MultiEdit,NotebookEdit,Bash(gh:*),WebFetch,WebSearch,Bash(curl:*),Bash(wget:*),mcp__github_file_ops__commit_files,mcp__github_file_ops__delete_files"
            --json-schema '{"type":"object","properties":{"review":{"type":"string"}},"required":["review"],"additionalProperties":false}'

      - name: Verify structured output
        if: steps.check-token.outputs.configured == 'true'
        env:
          STRUCTURED_OUTPUT: ${{ steps.review.outputs.structured_output }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        # Claude が success で終了しても構造化出力が空のことがある（max-turns
        # 到達等）。そのままでは後続 job が緑のまま無言になるため、明示的に
        # failure にして Checks を赤くする。
        # 出力を run スクリプトへ直接展開しないこと: Claude の出力は PR diff
        # 由来で攻撃者制御の文字列であり、JSON のダブルクォートや $(...) が
        # シェルを壊し任意コマンド実行の経路になり得るため、必ず env 経由で
        # 受け取ってから参照する。
        # さらに、正規表現の伏字化は PR diff 由来の誘導で回避され得るため、
        # この job（トークンへ到達できる唯一の job）で生トークンの完全一致を
        # 検査し、出力への漏洩を確実にブロックする。
        run: |
          # ここは「Claude アクションの structured_output 自体が欠落した場合」を捕捉する。
          if [ -z "$STRUCTURED_OUTPUT" ]; then
            echo "::error::Claude review structured output is empty"
            exit 1
          fi
          # 生トークンの完全一致チェック（正規表現の網を外れた漏洩をブロック）。
          case "$STRUCTURED_OUTPUT" in
            *"$CLAUDE_CODE_OAUTH_TOKEN"*)
              echo "::error::Claude review output contains the OAuth token"
              exit 1
              ;;
          esac

  post_review:
    name: Post PR review comment
    needs: claude_review
    # 成功時のみ起動する。失敗・キャンセル・skip時は投稿しない:
    # 前回の成功レビューコメントをそのまま残し（一過性の失敗で消さない）、
    # 失敗は review job の failure（Checks が赤）で通知する。
    # configured が false なら review step はスキップされ outputs.review が空になる
    # ため、review != '' が configured 条件を包含する。
    # ここは「job 出力（structured_output）が空の場合」を捕捉するゲート。
    if: >-
      needs.claude_review.result == 'success' &&
      needs.claude_review.outputs.review != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    env:
      REVIEW_JSON: ${{ needs.claude_review.outputs.review }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      REVIEWED_SHA: ${{ github.event.pull_request.head.sha }}
      RUN_URL: ${{ format('{0}/{1}/{2}/{3}', github.server_url, github.repository, 'actions/runs', github.run_id) }}

    steps:
      - uses: actions/checkout@v4
        with:
          # 整形ロジック（format-review.mjs）を読み込むために必要。claude_review
          # job の checkout は別ランナーで共有されない。cone モード既定の
          # sparse-checkout で .github/scripts を対象にする（ルート直下の
          # ファイルは常に展開される）。head SHA を明示するのはコンフリクト中の
          # PR で merge ref が無いため。初回導入時は base 側にこのファイルが
          # 存在しないため head を使うが、preview へマージ後は base.sha に
          # 切り替え、write 権限 job で head 由来コードを実行しないようにする。
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
          sparse-checkout: .github/scripts

      - name: Create or update Claude review comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            // 整形ロジックは .github/scripts/format-review.mjs に切り出し、
            // tests/unit/claude-review-format.test.ts で検証している。
            const { pathToFileURL } = require('node:url');
            const {
              buildReviewCommentBody,
              isOwnReviewComment,
            } = await import(
              pathToFileURL(
                `${process.env.GITHUB_WORKSPACE}/.github/scripts/format-review.mjs`
              ).href
            );

            const marker = '<!-- claude-auto-review-preview -->';
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issueNumber = Number(process.env.PR_NUMBER);
            const shortSha = process.env.REVIEWED_SHA.slice(0, 7);

            let reviewText;
            try {
              const { review } = JSON.parse(process.env.REVIEW_JSON);
              // ここは「JSON の review フィールドが空白のみの場合」を捕捉する。
              if (typeof review !== 'string' || review.trim() === '') {
                core.setFailed('Claude review output is empty');
                return;
              }
              reviewText = review.trim();
            } catch (error) {
              core.setFailed('Claude review output is not valid JSON: ' + error.message);
              return;
            }

            const commitUrl =
              `${process.env.GITHUB_SERVER_URL}/${owner}/${repo}/commit/${process.env.REVIEWED_SHA}`;
            const body = buildReviewCommentBody({
              marker,
              shortSha,
              commitUrl,
              runUrl: process.env.RUN_URL,
              reviewText,
            });

            // 全ページから探す。判定ロジックは isOwnReviewComment に切り出し、
            // テストで検証している。
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: issueNumber,
              per_page: 100,
            });
            const existing = comments.find((comment) => isOwnReviewComment(comment, marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issueNumber,
                body,
              });
            }
