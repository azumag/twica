# Claude Auto Review (preview)
#
# preview ブランチをターゲットにした PR のたびに、Claude Code（モデル: opus）が
# 追加された変更を自動レビューし、PR コメントで指摘を報告する。
#
# 経緯: 旧版は `push: branches: [preview]` で発火していたが、
# anthropics/claude-code-action@v1 が push イベントをサポートしておらず
# preview への push のたびに失敗していた（PR #915 で一時削除）。
# 本版は action が対応している `pull_request` イベントへ変更して復活させる。
#
# 前提:
# - GitHub Secrets に `CLAUDE_CODE_OAUTH_TOKEN`（Claude Code OAuth トークン）を設定。
#   トークンの発行・更新はオーナーが `claude setup-token` で実施し、
#   GitHub Secret を自身で差し替えること（Action 側で値を読み書きしない）。
# - `pull_request` イベントは PR ヘッド側（マージ ref）のワークフロー定義で
#   実行される。ベースブランチ側の定義が使われるのは `pull_request_target` /
#   `push` / `schedule` などである。
#   同一リポジトリのブランチで動く＝PR 作成者がプロンプトやツール許可を
#   書き換えられる点に注意する（fork では secrets が渡らず実行されない）。
#   セキュリティ上のリスク受容: 同一リポジトリの write 権限保持者はこの
#   ワークフローを改変して CLAUDE_CODE_OAUTH_TOKEN を取得できる。より強い
#   保護には environment + required reviewers が必要になるが、PR のたびに
#   承認が要って自動レビューが機能しなくなるため、本リポジトリでは
#   「write 権限保持者は全員トークンを取得可能」というリスクを受容する。
#   実効的な封じ込めは「fork PR に secrets が渡らない」「read-only
#   GITHUB_TOKEN」「投稿前のトークン伏字化」の3点に依存している。
#   非対話モードでは未承認ツールのプロンプトは自動拒否されるが、
#   --allowedTools / --disallowedTools は Bash の網羅的 allowlist ではない
#   （承認済みパターンの部分一致で実行されうる。ls/cat 等は実行可能）ため、
#   curl/wget の deny は迂回可能な緩和に過ぎない。
#   なお @メンションの置換は意図的に行わない。メンション注入は write 権限
#   保持者起点（既にトークン取得可能なカテゴリ）でリスク受容済みであり、
#   無条件置換はコードブロック内の `actions/checkout@v4` 等を壊す実害が
#   あるため。
#
# Claude を実行する job とコメントを投稿する job を分離し、Claude 側には
# 読み取り専用の GITHUB_TOKEN だけを渡す。投稿用の pull-requests: write は
# Claude の実行終了後に別 job でのみ利用する。
name: Claude Auto Review (preview)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [preview]
    # ドキュメントのみの変更では opus を回さない（コスト抑制）。
    # .github/workflows/** は対象外にしない（ワークフロー自身の変更は必ずレビューする）。
    paths-ignore:
      # `**` は「/ を含む任意の文字列」のため、`**/*.md` はルート直下の
      # README.md 等にマッチしない解釈になり得る。`**.md` なら全階層にマッチする。
      - '**.md'
    # main 向け PR は対象外（preview でレビュー済みの内容を昇格するだけのため意図的）

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude_review:
    name: Review PR changes
    # draft PR では毎 push ごとに opus を回さない
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    outputs:
      review: ${{ steps.review.outputs.structured_output }}

    steps:
      - name: Check token configured
        id: check-token
        # job の env を outputs から参照するのは GitHub Actions のコンテキスト
        # 可用性の境界で壊れやすいため、step output 経由で確実に渡す。
        run: |
          configured=${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
          echo "configured=$configured" >> "$GITHUB_OUTPUT"
          if [ "$configured" != "true" ]; then
            echo "CLAUDE_CODE_OAUTH_TOKEN が未設定、または fork PR のため secrets が渡らないため、Claude 自動レビューはスキップされます。" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Checkout repository
        if: steps.check-token.outputs.configured == 'true'
        uses: actions/checkout@v4
        with:
          # three-dot diff (base...head) は merge-base 解決に双方の履歴が必要。
          # fetch-depth を絞ると base 側の commit が欠けて diff が失敗しうるため
          # 全履歴を取得する（チェックアウト時間と安全性のトレードオフ）。
          fetch-depth: 0
          persist-credentials: false

      - name: Claude Code Review (opus)
        id: review
        if: steps.check-token.outputs.configured == 'true'
        # 供給元タグの更新で挙動が変わり得るため、コミットSHAピンが定石だが、
        # この環境から GitHub API へ到達できず（api.github.com への疎通不可）
        # 現在の v1 タグの SHA を取得できないため、タグ運用を維持する。
        # OAuth トークンを渡す唯一の action なので、SHA 取得手段ができ次第
        # ピン化する（actionlint 導入時に対象にする）。
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Claude GitHub App の書き込み権限ではなく、この job の読み取り専用
          # GITHUB_TOKEN を明示的に使う。
          github_token: ${{ github.token }}
          prompt: |
            REPO: ${{ github.repository }}
            PR: #${{ github.event.pull_request.number }}
            BASE SHA: ${{ github.event.pull_request.base.sha }}
            HEAD SHA: ${{ github.event.pull_request.head.sha }}

            この PR で追加された変更を厳しくレビューしてください。
            対象は PR 全体の差分です。

            `git diff --find-renames ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}`

            必要に応じて `git log`、`git show`、関連ソースの読み取りで文脈を確認してください。
            `git diff` が失敗する場合（base が孤立している等）は、その旨を
            「レビュー不可」として明示してください。
            リポジトリの AGENTS.md がある場合はそれを読み、レビュー観点として従ってください。

            レビュー観点（AGENTS.md 準拠）:
            - コード品質とベストプラクティス
            - 潜在的なバグとエッジケース
            - パフォーマンスへの影響
            - セキュリティ考慮
            - コードの簡潔性（過度な抽象化・複雑化の回避）
            - 単体テストのカバレッジは十分か
            - YAGNI（過剰な実装と設計の回避）

            指摘は日本語で行い、具体的な問題にはファイルと行を明記してください。
            問題がない場合は「指摘なし」と明記してください。
            レビュー本文は日本語で 6000 字以内に収めてください。
            コードやGitHub上の状態は変更せず、レビュー本文だけを返してください。
            最終回答は指定されたJSON SchemaのreviewフィールドにMarkdownで格納してください。
          claude_args: >-
            --model opus
            --max-turns 30
            --allowedTools "Bash(git diff:*),Bash(git log:*),Bash(git show:*),Read,Grep,Glob"
            --disallowedTools "Edit,Write,MultiEdit,NotebookEdit,Bash(gh:*),WebFetch,WebSearch,Bash(curl:*),Bash(wget:*),mcp__github_file_ops__commit_files,mcp__github_file_ops__delete_files"
            --json-schema '{"type":"object","properties":{"review":{"type":"string"}},"required":["review"],"additionalProperties":false}'

      - name: Verify structured output
        if: steps.check-token.outputs.configured == 'true'
        env:
          STRUCTURED_OUTPUT: ${{ steps.review.outputs.structured_output }}
        # 実績: PR #916 の round-10 以降、この経路（structured_output → JSON パース
        # → コメント投稿）でレビューコメントが投稿されているため動作実証済み。
        # Claude が success で終了しても構造化出力が空のことがある（max-turns
        # 到達等）。そのままでは後続 job が緑のまま無言になるため、ここで
        # 明示的に failure にして Checks を赤くする。
        # 出力を run スクリプトへ直接展開しないこと: Claude の出力は PR diff
        # 由来で攻撃者制御の文字列であり、JSON のダブルクォートや $(...) が
        # シェルを壊し任意コマンド実行の経路になり得るため、必ず env 経由で
        # 受け取ってから参照する。
        run: |
          if [ -z "$STRUCTURED_OUTPUT" ]; then
            echo "::error::Claude review structured output is empty"
            exit 1
          fi

  post_review:
    name: Post PR review comment
    needs: claude_review
    # 成功時のみ起動する。失敗・キャンセル・skip時は投稿しない:
    # 前回の成功レビューコメントをそのまま残し（一過性の失敗で消さない）、
    # 失敗は review job の failure（Checks が赤）で通知する。
    # configured が false なら review step はスキップされ outputs.review が空になる
    # ため、review != '' が configured 条件を包含する。
    if: >-
      needs.claude_review.result == 'success' &&
      needs.claude_review.outputs.review != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    env:
      REVIEW_JSON: ${{ needs.claude_review.outputs.review }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      REVIEWED_SHA: ${{ github.event.pull_request.head.sha }}

    steps:
      - name: Create or update Claude review comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            // 整形ロジックは .github/scripts/format-review.mjs に切り出し、
            // tests/unit/claude-review-format.test.ts で検証している（#916 round-10）。
            const { pathToFileURL } = require('node:url');
            const {
              redactSecrets,
              truncateAndCloseFences,
              buildReviewComment,
            } = await import(
              pathToFileURL(
                `${process.env.GITHUB_WORKSPACE}/.github/scripts/format-review.mjs`
              ).href
            );

            const marker = '<!-- claude-auto-review-preview -->';
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issueNumber = Number(process.env.PR_NUMBER);
            const shortSha = process.env.REVIEWED_SHA.slice(0, 7);

            let reviewText;
            try {
              const { review } = JSON.parse(process.env.REVIEW_JSON);
              if (typeof review !== 'string' || review.trim() === '') {
                core.setFailed('Claude review output is empty');
                return;
              }
              reviewText = review.trim();
            } catch (error) {
              core.setFailed('Claude review output is not valid JSON: ' + error.message);
              return;
            }

            reviewText = redactSecrets(reviewText);
            reviewText = truncateAndCloseFences(reviewText);

            const commitUrl =
              `${process.env.GITHUB_SERVER_URL}/${owner}/${repo}/commit/${process.env.REVIEWED_SHA}`;
            const body = buildReviewComment({ marker, shortSha, commitUrl, reviewText });

            // 全ページから探す。マーカーは誰でも知り得るため、投稿者を Bot に
            // 限定して第三者コメントの誤上書きを防ぐ。GITHUB_TOKEN での投稿は
            // github-actions[bot]（type=Bot）になるため type 判定で足りる
            // （PAT 等の別トークンへ切り替える場合は投稿者判定の見直しが必要）。
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: issueNumber,
              per_page: 100,
            });
            const existing = comments.find((comment) =>
              comment.user?.type === 'Bot' &&
              comment.body?.split('\n', 1)[0].trim() === marker,
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issueNumber,
                body,
              });
            }
