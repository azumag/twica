# Claude Auto Review (preview)
#
# preview ブランチをターゲットにした PR のたびに、Claude Code（モデル: opus）が
# 追加された変更を自動レビューし、PR コメントで指摘を報告する。
#
# 経緯: 旧版は `push: branches: [preview]` で発火していたが、
# anthropics/claude-code-action@v1 が push イベントをサポートしておらず
# preview への push のたびに失敗していた（PR #915 で一時削除）。
# 本版は action が対応している `pull_request` イベントへ変更して復活させる。
#
# 前提:
# - GitHub Secrets に `CLAUDE_CODE_OAUTH_TOKEN`（Claude Code OAuth トークン）を設定。
#   トークンの発行・更新はオーナーが `claude setup-token` で実施し、
#   GitHub Secret を自身で差し替えること（Action 側で値を読み書きしない）。
# - `pull_request` イベントは PR ヘッド側（マージ ref）のワークフロー定義で
#   実行される。ベースブランチ側の定義が使われるのは `pull_request_target` /
#   `push` / `schedule` などである。
#   同一リポジトリのブランチで動く＝PR 作成者がプロンプトやツール許可を
#   書き換えられる点に注意する（fork では secrets が渡らず実行されない）。
#   セキュリティ上のリスク受容: 同一リポジトリの write 権限保持者はこの
#   ワークフローを改変して CLAUDE_CODE_OAUTH_TOKEN を取得できる。より強い
#   保護には environment + required reviewers が必要になるが、PR のたびに
#   承認が要って自動レビューが機能しなくなるため、本リポジトリでは
#   「write 権限保持者は全員トークンを取得可能」というリスクを受容する。
#   実際の封じ込めは「read-only GITHUB_TOKEN」「非対話モードで承認プロンプトが
#   通らない」「投稿前にトークン/メンションをサニタイズ」の3点に依存しており、
#   --allowedTools / --disallowedTools は Bash の網羅的 allowlist ではない
#   （自動承認リストに過ぎない。ls/cat 等は実行可能）。
#   なお @メンションの置換は意図的に行わない。メンション注入は write 権限
#   保持者起点（既にトークン取得可能なカテゴリ）でリスク受容済みであり、
#   無条件置換はコードブロック内の `actions/checkout@v4` 等を壊す実害が
#   あるため。
#
# Claude を実行する job とコメントを投稿する job を分離し、Claude 側には
# 読み取り専用の GITHUB_TOKEN だけを渡す。投稿用の pull-requests: write は
# Claude の実行終了後に別 job でのみ利用する。
name: Claude Auto Review (preview)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [preview]
    # ドキュメントのみの変更では opus を回さない（コスト抑制）。
    # .github/workflows/** は対象外にしない（ワークフロー自身の変更は必ずレビューする）。
    paths-ignore:
      - '**/*.md'
    # main 向け PR は対象外（preview でレビュー済みの内容を昇格するだけのため意図的）

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude_review:
    name: Review PR changes
    # draft PR では毎 push ごとに opus を回さない
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    outputs:
      review: ${{ steps.review.outputs.structured_output }}
      configured: ${{ steps.check-token.outputs.configured }}

    steps:
      - name: Check token configured
        id: check-token
        # job の env を outputs から参照するのは GitHub Actions のコンテキスト
        # 可用性の境界で壊れやすいため、step output 経由で確実に渡す。
        run: |
          configured=${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
          echo "configured=$configured" >> "$GITHUB_OUTPUT"
          if [ "$configured" != "true" ]; then
            echo "CLAUDE_CODE_OAUTH_TOKEN が未設定のため、Claude 自動レビューはスキップされます。" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Checkout repository
        if: steps.check-token.outputs.configured == 'true'
        uses: actions/checkout@v4
        with:
          # three-dot diff (base...head) は merge-base 解決に双方の履歴が必要。
          # fetch-depth を絞ると base 側の commit が欠けて diff が失敗しうるため
          # 全履歴を取得する（チェックアウト時間と安全性のトレードオフ）。
          fetch-depth: 0
          persist-credentials: false

      - name: Claude Code Review (opus)
        id: review
        if: steps.check-token.outputs.configured == 'true'
        # 供給元タグの更新で挙動が変わり得るため、コミットSHAピンが定石だが、
        # 本リポジトリの他ワークフロー（actions/checkout@v4 等）が可変タグ運用の
        # ため、ここも同様にタグ運用とし、将来 actionlint 導入時に SHA ピン化を検討する。
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Claude GitHub App の書き込み権限ではなく、この job の読み取り専用
          # GITHUB_TOKEN を明示的に使う。
          github_token: ${{ github.token }}
          prompt: |
            REPO: ${{ github.repository }}
            PR: #${{ github.event.pull_request.number }}
            BASE SHA: ${{ github.event.pull_request.base.sha }}
            HEAD SHA: ${{ github.event.pull_request.head.sha }}

            この PR で追加された変更を厳しくレビューしてください。
            対象は PR 全体の差分です。

            `git diff --find-renames ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}`

            必要に応じて `git log`、`git show`、関連ソースの読み取りで文脈を確認してください。
            `git diff` が失敗する場合（base が孤立している等）は、その旨を
            「レビュー不可」として明示してください。
            リポジトリの AGENTS.md がある場合はそれを読み、レビュー観点として従ってください。

            レビュー観点（AGENTS.md 準拠）:
            - コード品質とベストプラクティス
            - 潜在的なバグとエッジケース
            - パフォーマンスへの影響
            - セキュリティ考慮
            - コードの簡潔性（過度な抽象化・複雑化の回避）
            - 単体テストのカバレッジは十分か
            - YAGNI（過剰な実装と設計の回避）

            指摘は日本語で行い、具体的な問題にはファイルと行を明記してください。
            問題がない場合は「指摘なし」と明記してください。
            レビュー本文は日本語で 6000 字以内に収めてください。
            コードやGitHub上の状態は変更せず、レビュー本文だけを返してください。
            最終回答は指定されたJSON SchemaのreviewフィールドにMarkdownで格納してください。
          claude_args: >-
            --model opus
            --max-turns 30
            --allowedTools "Bash(git diff:*),Bash(git log:*),Bash(git show:*),Read,Grep,Glob"
            --disallowedTools "WebFetch,WebSearch,Bash(curl:*),Bash(wget:*),mcp__github_file_ops__commit_files,mcp__github_file_ops__delete_files"
            --json-schema '{"type":"object","properties":{"review":{"type":"string"}},"required":["review"],"additionalProperties":false}'

  post_review:
    name: Post PR review comment
    needs: claude_review
    # トークン未設定・skip時は投稿しない。キャンセル時も投稿しない
    # （先行runの正常レビューを失敗通知で上書きしないため）。
    # configured が空（review job が timeout 等で outputs 未設定）でも
    # 失敗通知を届けるため `!= 'false'` で判定する。
    if: >-
      !cancelled() &&
      needs.claude_review.result != 'skipped' &&
      needs.claude_review.outputs.configured != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    env:
      REVIEW_JSON: ${{ needs.claude_review.outputs.review }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      REVIEWED_SHA: ${{ github.event.pull_request.head.sha }}
      REVIEW_RESULT: ${{ needs.claude_review.result }}

    steps:
      - name: Create or update Claude review comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const marker = '<!-- claude-auto-review-preview -->';
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issueNumber = Number(process.env.PR_NUMBER);
            const shortSha = process.env.REVIEWED_SHA.slice(0, 7);

            let isFailure = true;
            let reviewText;
            if (process.env.REVIEW_RESULT !== 'success') {
              reviewText =
                `レビューを実行できませんでした（job result: \`${process.env.REVIEW_RESULT}\`）。` +
                `原因の候補: \`--max-turns\` 到達、\`timeout-minutes\` 超過、` +
                `または構造化出力の生成失敗。`;
            } else if (!process.env.REVIEW_JSON) {
              reviewText = 'レビューを実行できませんでした（Claude の構造化出力が生成されませんでした）。';
            } else {
              try {
                const { review } = JSON.parse(process.env.REVIEW_JSON);
                if (typeof review !== 'string' || review.trim() === '') {
                  reviewText = 'レビューを実行できませんでした（Claude の構造化出力が空でした）。';
                } else {
                  isFailure = false;
                  reviewText = review.trim();
                }
              } catch (error) {
                reviewText = 'レビューを実行できませんでした（Claude の構造化出力が不正な JSON でした）。';
              }
            }

            // 失敗時は PR コメントを更新しない。前回の成功レビューをそのまま残し
            // （一過性の失敗で消さない）、失敗理由はこの job の summary と
            // 赤くなる Checks（review job の failure）で通知する。
            // これにより文字列解析による「前回本文の保持」ロジックが不要になり、
            // 本文中の --- 誤検出・フッター増殖・失敗メッセージ残留などの
            // バグクラスを構造的に排除できる。
            if (isFailure) {
              fs.appendFileSync(
                process.env.GITHUB_STEP_SUMMARY,
                `### Claude Auto Review（失敗）\n\n${reviewText}\n\nReviewed commit: \`${shortSha}\`\n`
              );
              return;
            }

            // プロンプトインジェクションで diff 経由の指示により Claude が
            // 環境上のシークレット（CLAUDE_CODE_OAUTH_TOKEN 等）を出力に含めて
            // も、公開 PR コメントへ漏れないよう既知のトークン形式を伏字化する。
            // GitHub のシークレットマスキングはログにのみ効き、API のコメント
            // 本文には適用されないため、ここでのサニタイズが必要。
            const SECRET_PATTERN =
              /\b(sk-ant-[A-Za-z0-9_-]{10,}|gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,})\b/g;
            reviewText = reviewText.replace(SECRET_PATTERN, '[REDACTED]');

            // GitHub の issue comment は 65536 文字上限。プロンプトで 6000 字以内を
            // 指示しているが、万一長い場合は安全側で行単位に切り詰める
            // （さらに ``` が奇数なら閉じフェンスを補い、後続のフッターが
            // コードブロックに飲まれないようにする）。
            const MAX_BODY_LENGTH = 60000;
            if (reviewText.length > MAX_BODY_LENGTH) {
              const truncated = reviewText.slice(0, MAX_BODY_LENGTH);
              const lastNewline = truncated.lastIndexOf('\n');
              reviewText =
                (lastNewline > 0 ? truncated.slice(0, lastNewline) : truncated) +
                '\n\n（長すぎるため省略）';
              const fenceCount = (reviewText.match(/```/g) || []).length;
              if (fenceCount % 2 === 1) {
                reviewText += '\n```';
              }
            }

            const body =
              `${marker}\n## Claude Auto Review\n\n` +
              `状態: **成功** ／ Reviewed commit: \`${shortSha}\`\n\n` +
              `${reviewText}\n\n` +
              `*Generated by Claude Code (opus)*`;

            // 全ページから探す。マーカーは誰でも知り得るため、投稿者を Bot に
            // 限定して第三者コメントの誤上書きを防ぐ（login はハードコードせず
            // type のみで判定し、将来 PAT / GitHub App へ切り替えても既存コメント
            // を引き続き更新できるようにする）。
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: issueNumber,
              per_page: 100,
            });
            const existing = comments.find((comment) =>
              comment.user?.type === 'Bot' &&
              comment.body?.split('\n', 1)[0].trim() === marker,
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issueNumber,
                body,
              });
            }
