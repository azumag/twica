# Claude Auto Review (preview)
#
# preview ブランチをターゲットにした PR のたびに、Claude Code（モデル: opus）が
# 追加された変更を自動レビューし、PR コメントで指摘を報告する。
#
# 経緯: 旧版は `push: branches: [preview]` で発火していたが、
# anthropics/claude-code-action@v1 が push イベントをサポートしておらず
# preview への push のたびに失敗していた（PR #915 で一時削除）。
# 本版は action が対応している `pull_request` イベントへ変更して復活させる。
#
# 前提:
# - GitHub Secrets に `CLAUDE_CODE_OAUTH_TOKEN`（Claude Code OAuth トークン）を設定。
#   トークンの発行・更新はオーナーが `claude setup-token` で実施し、
#   GitHub Secret を自身で差し替えること（Action 側で値を読み書きしない）。
# - ワークフローはベースブランチ（preview）に存在する必要がある
#   （pull_request イベントはベースブランチのワークフロー定義で処理される）。
#
# Claude を実行する job とコメントを投稿する job を分離し、Claude 側には
# 読み取り専用の GITHUB_TOKEN だけを渡す。投稿用の pull-requests: write は
# Claude の実行終了後に別 job でのみ利用する。
name: Claude Auto Review (preview)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [preview]

concurrency:
  group: ${{ github.workflow }}-claude-auto-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude_review:
    name: Review PR changes
    # draft PR では毎 push ごとに opus を回さない
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    env:
      CLAUDE_CODE_OAUTH_TOKEN_CONFIGURED: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    outputs:
      review: ${{ steps.review.outputs.structured_output }}
      configured: ${{ env.CLAUDE_CODE_OAUTH_TOKEN_CONFIGURED }}

    steps:
      - name: Checkout repository
        if: env.CLAUDE_CODE_OAUTH_TOKEN_CONFIGURED == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Claude Code Review (opus)
        id: review
        if: env.CLAUDE_CODE_OAUTH_TOKEN_CONFIGURED == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Claude GitHub App の書き込み権限ではなく、この job の読み取り専用
          # GITHUB_TOKEN を明示的に使う。
          github_token: ${{ github.token }}
          prompt: |
            REPO: ${{ github.repository }}
            PR: #${{ github.event.pull_request.number }}
            BASE SHA: ${{ github.event.pull_request.base.sha }}
            HEAD SHA: ${{ github.event.pull_request.head.sha }}

            この PR で追加された変更を厳しくレビューしてください。
            対象は PR 全体の差分です。

            `git diff --find-renames ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}`

            必要に応じて `git log`、`git show`、関連ソースの読み取りで文脈を確認してください。

            レビュー観点（AGENTS.md 準拠）:
            - コード品質とベストプラクティス
            - 潜在的なバグとエッジケース
            - パフォーマンスへの影響
            - セキュリティ考慮
            - コードの簡潔性（過度な抽象化・複雑化の回避）
            - 単体テストのカバレッジは十分か
            - YAGNI（過剰な実装と設計の回避）

            指摘は日本語で行い、具体的な問題にはファイルと行を明記してください。
            問題がない場合は「指摘なし」と明記してください。
            コードやGitHub上の状態は変更せず、レビュー本文だけを返してください。
            最終回答は指定されたJSON SchemaのreviewフィールドにMarkdownで格納してください。
          claude_args: >-
            --model opus
            --max-turns 30
            --allowedTools "Bash(git diff:*),Bash(git log:*),Bash(git show:*),Read,Grep,Glob"
            --disallowedTools "Edit,Write,MultiEdit,NotebookEdit,Bash(gh:*),Bash(curl:*),Bash(wget:*),WebFetch,WebSearch,mcp__github_file_ops__commit_files,mcp__github_file_ops__delete_files"
            --json-schema '{"type":"object","properties":{"review":{"type":"string"}},"required":["review"],"additionalProperties":false}'

  post_review:
    name: Post PR review comment
    needs: claude_review
    # トークン未設定・skip時は投稿しない。キャンセル時も投稿しない
    # （先行runの正常レビューを失敗通知で上書きしないため）。
    if: >-
      !cancelled() &&
      needs.claude_review.result != 'skipped' &&
      needs.claude_review.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    env:
      REVIEW_JSON: ${{ needs.claude_review.outputs.review }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      REVIEWED_SHA: ${{ github.event.pull_request.head.sha }}
      REVIEW_RESULT: ${{ needs.claude_review.result }}

    steps:
      - name: Create or update Claude review comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issueNumber = Number(process.env.PR_NUMBER);
            const shortSha = process.env.REVIEWED_SHA.slice(0, 7);

            // 成功系と失敗系で別マーカーを使い、失敗通知が既存の正常レビューを
            // 上書きしないようにする（連続pushキャンセル・APIエラー等での損失防止）。
            const successMarker = '<!-- claude-auto-review-preview -->';
            const failureMarker = '<!-- claude-auto-review-failure -->';

            let reviewText;
            let isFailure = false;
            if (process.env.REVIEW_RESULT !== 'success' || !process.env.REVIEW_JSON) {
              isFailure = true;
              reviewText =
                `レビューを実行できませんでした（job result: \`${process.env.REVIEW_RESULT}\`）。` +
                `原因の候補: \`--max-turns\` 到達、\`timeout-minutes\` 超過、` +
                `または構造化出力の生成失敗。`;
            } else {
              try {
                const { review } = JSON.parse(process.env.REVIEW_JSON);
                if (typeof review !== 'string' || review.trim() === '') {
                  isFailure = true;
                  reviewText = 'レビューを実行できませんでした（Claude の構造化出力が空でした）。';
                } else {
                  reviewText = review.trim();
                }
              } catch (error) {
                isFailure = true;
                reviewText = 'レビューを実行できませんでした（Claude の構造化出力が不正な JSON でした）。';
              }
            }

            // GitHub の issue comment は 65536 文字上限。長文レビューで 422 に
            // ならないよう安全側で切り詰める。
            const MAX_BODY_LENGTH = 60000;
            if (reviewText.length > MAX_BODY_LENGTH) {
              reviewText = reviewText.slice(0, MAX_BODY_LENGTH) + '\n\n（長すぎるため省略）';
            }

            const marker = isFailure ? failureMarker : successMarker;
            const body =
              `${marker}\n## Claude Auto Review\n\n` +
              `${reviewText}\n\n` +
              `Reviewed commit: \`${shortSha}\`\n\n` +
              `*Generated by Claude Code (opus)*`;

            // 最近のコメントから探す（投稿者を bot に限定して第三者コメントの
            // 誤上書きを防ぐ。マーカーは誰でも知り得るため投稿者チェックは必須）。
            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: issueNumber,
              per_page: 100,
              direction: 'desc',
            });
            const existing = comments.find((comment) =>
              comment.user?.type === 'Bot' &&
              comment.user?.login === 'github-actions[bot]' &&
              comment.body?.includes(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issueNumber,
                body,
              });
            }
