# Claude Auto Review (preview)
#
# preview ブランチへの push（通常は feature ブランチからの PR マージ）のたびに、
# Claude Code（モデル: opus）が push 全体の差分を自動レビューし、
# 対象コミットのコメントとして結果を報告する。
#
# 前提:
# - GitHub Secrets に `CLAUDE_CODE_OAUTH_TOKEN`（Claude Code OAuth トークン）を設定
# - ワークフローはデフォルトブランチ（main）に存在する必要がある
#
# Claude を実行する job とコメントを投稿する job を分離し、Claude 側には
# 読み取り専用の GITHUB_TOKEN だけを渡す。投稿用の contents: write は
# Claude の実行終了後に別 job でのみ利用する。
name: Claude Auto Review (preview)

on:
  push:
    branches: [preview]

concurrency:
  group: claude-auto-review-preview
  cancel-in-progress: true

jobs:
  claude_review:
    name: Review pushed changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: read
      pull-requests: read
    env:
      CLAUDE_CODE_OAUTH_TOKEN_CONFIGURED: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    outputs:
      review: ${{ steps.review.outputs.structured_output }}
      reviewed_sha: ${{ github.sha }}

    steps:
      - name: Checkout repository
        if: env.CLAUDE_CODE_OAUTH_TOKEN_CONFIGURED == 'true'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Claude Code Review (opus)
        id: review
        if: env.CLAUDE_CODE_OAUTH_TOKEN_CONFIGURED == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Claude GitHub App の書き込み権限ではなく、この job の読み取り専用
          # GITHUB_TOKEN を明示的に使う。
          github_token: ${{ github.token }}
          prompt: |
            REPO: ${{ github.repository }}
            BRANCH: preview
            BEFORE SHA: ${{ github.event.before }}
            AFTER SHA: ${{ github.sha }}

            preview ブランチへの今回の push で追加された変更を厳しくレビューしてください。
            単一コミットの親との差分ではなく、必ず次の push 全体の差分を対象にします。

            `git diff --find-renames ${{ github.event.before }} ${{ github.sha }}`

            必要に応じて `git log`、`git show`、関連ソースの読み取りで文脈を確認してください。

            レビュー観点（AGENTS.md 準拠）:
            - コード品質とベストプラクティス
            - 潜在的なバグとエッジケース
            - パフォーマンスへの影響
            - セキュリティ考慮
            - コードの簡潔性（過度な抽象化・複雑化の回避）
            - 単体テストのカバレッジは十分か
            - YAGNI（過剰な実装と設計の回避）

            指摘は日本語で行い、具体的な問題にはファイルと行を明記してください。
            問題がない場合は「指摘なし」と明記してください。
            コードやGitHub上の状態は変更せず、レビュー本文だけを返してください。
            最終回答は指定されたJSON SchemaのreviewフィールドにMarkdownで格納してください。
          claude_args: >-
            --model opus
            --max-turns 30
            --allowedTools "Bash(git diff:*),Bash(git log:*),Bash(git show:*),Read,Grep,Glob"
            --disallowedTools "Edit,Write,MultiEdit,NotebookEdit,Bash(gh:*),mcp__github_file_ops__commit_files,mcp__github_file_ops__delete_files"
            --json-schema '{"type":"object","properties":{"review":{"type":"string"}},"required":["review"],"additionalProperties":false}'

  post_review:
    name: Post commit comment
    needs: claude_review
    if: needs.claude_review.result == 'success' && needs.claude_review.outputs.review != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      COMMIT_SHA: ${{ needs.claude_review.outputs.reviewed_sha }}
      REVIEW_JSON: ${{ needs.claude_review.outputs.review }}

    steps:
      - name: Create or update Claude review comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const marker = '<!-- claude-auto-review-preview -->';
            const { review } = JSON.parse(process.env.REVIEW_JSON);
            if (typeof review !== 'string' || review.trim() === '') {
              core.setFailed('Claude review output is empty');
              return;
            }

            const body = `${marker}\n## Claude Auto Review\n\n${review.trim()}\n\n*Generated by Claude Code (opus)*`;
            const params = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: process.env.COMMIT_SHA,
              per_page: 100,
            };
            const { data: comments } = await github.rest.repos.listCommentsForCommit(params);
            const existing = comments.find((comment) =>
              comment.user?.login === 'github-actions[bot]' && comment.body?.includes(marker),
            );

            if (existing) {
              await github.rest.repos.updateCommitComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.repos.createCommitComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: process.env.COMMIT_SHA,
                body,
              });
            }
