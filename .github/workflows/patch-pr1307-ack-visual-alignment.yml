name: Patch PR 1307 ACK visual alignment

on:
  push:
    branches:
      - fix/1002-overlay-queue-recovery

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/1002-overlay-queue-recovery

      - name: Apply mandatory ACK/visual alignment fix
        run: |
          python3 - <<'PY'
          from pathlib import Path

          page = Path('src/app/overlay/[streamerId]/page.tsx')
          text = page.read_text(encoding='utf-8')
          old = '''        // This recovery path cannot reach the normal fallback/commit chain;
        // the queue-level invariant above has already rejected its transport ACK.
        scheduleQueueRecovery(true);'''
          new = '''        // The transport ACK is already false, so do not keep a failed visual
        // presentation on screen for a full window before realtime retries it.
        // Advance promptly to keep ACK semantics and viewer-visible behavior aligned.
        scheduleQueueRecovery(false);'''
          if text.count(old) != 1:
              raise SystemExit(f'page target count={text.count(old)}')
          page.write_text(text.replace(old, new), encoding='utf-8')

          test = Path('tests/unit/components/overlay-page.test.tsx')
          text = test.read_text(encoding='utf-8')
          old = '''    // Sound setup is presentation-only. The card already started, so an error
    // must not erase the business event immediately.
    expect(screen.getByText('TimerThrow')).toBeInTheDocument()

    act(() => {
      onGachaResult?.({
        type: 'gacha',
        card: { id: 'card-ok2', name: 'RecoveredFromTimer', description: null, image_url: null, rarity: 'common' },
        userTwitchUsername: 'Viewer',
      })
    })
    expect(screen.queryByText('RecoveredFromTimer')).not.toBeInTheDocument()

    // Recovery preserves the configured two-second display window, then uses
    // the existing 500ms inter-card gap before advancing the queued card.
    await act(async () => {
      await vi.advanceTimersByTimeAsync(2_500)
    })
    expect(screen.queryByText('TimerThrow')).not.toBeInTheDocument()
    expect(screen.getByText('RecoveredFromTimer')).toBeInTheDocument()'''
          new = '''    // ACK=false allows realtime to retry this draw, so the failed visual must
    // not remain for a full display window and then appear again on redelivery.
    expect(screen.getByText('TimerThrow')).toBeInTheDocument()

    act(() => {
      onGachaResult?.({
        type: 'gacha',
        card: { id: 'card-ok2', name: 'RecoveredFromTimer', description: null, image_url: null, rarity: 'common' },
        userTwitchUsername: 'Viewer',
      })
    })
    expect(screen.queryByText('RecoveredFromTimer')).not.toBeInTheDocument()

    // Recovery hides the failed card immediately and keeps only the existing
    // 500ms inter-card gap before advancing the locally queued next card.
    await act(async () => {
      await vi.advanceTimersByTimeAsync(501)
    })
    expect(screen.queryByText('TimerThrow')).not.toBeInTheDocument()
    expect(screen.getByText('RecoveredFromTimer')).toBeInTheDocument()'''
          if text.count(old) != 1:
              raise SystemExit(f'test target count={text.count(old)}')
          test.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Commit mandatory fix and remove one-off workflow
        run: |
          rm .github/workflows/patch-pr1307-ack-visual-alignment.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/overlay/[streamerId]/page.tsx tests/unit/components/overlay-page.test.tsx .github/workflows/patch-pr1307-ack-visual-alignment.yml
          git commit -m "fix(overlay): ACK失敗時は表示を即時回復する" -m "Refs #1002 #1307"
          git push origin HEAD:fix/1002-overlay-queue-recovery
