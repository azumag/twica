name: Apply Issue 1296 service patch

on:
  push:
    branches:
      - fix/1296-anti-repeat-gacha
    paths:
      - .github/workflows/apply-1296-service-patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/1296-anti-repeat-gacha
          fetch-depth: 0

      - name: Apply guarded source patch
        run: python scripts/apply-1296-service-patch.py

      - name: Remove one-shot helpers and commit
        run: |
          rm .github/workflows/apply-1296-service-patch.yml
          rm scripts/apply-1296-service-patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/services/gacha.ts src/app/api/gacha/route.ts .github/workflows/apply-1296-service-patch.yml scripts/apply-1296-service-patch.py
          git commit -m "feat(gacha): 直前履歴を反復抑制抽選へ接続" -m "Refs #1296"
          git push origin HEAD:fix/1296-anti-repeat-gacha
