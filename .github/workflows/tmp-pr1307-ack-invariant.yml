name: Temporary PR1307 ACK invariant fix

on:
  push:
    branches:
      - fix/1002-overlay-queue-recovery

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/1002-overlay-queue-recovery
          fetch-depth: 0

      - name: Restore queue-error ACK invariant
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/app/overlay/[streamerId]/page.tsx')
          text = path.read_text(encoding='utf-8')

          old = """    const handleQueueError = (error: unknown) => {
      if (!displayStarted) {
        // A card that never started is a failed business-event presentation.
        settleDisplayCommit(next.displayInstanceId, false);
        scheduleQueueRecovery(false);
"""
          new = """    const handleQueueError = (error: unknown) => {
      // Any exception that reaches the queue boundary is a failed presentation.
      // Settle the transport ACK before choosing a visual recovery path. This is
      // intentionally unconditional and idempotent: by the time the display
      // window has elapsed its one-shot watchdog may already have fired, so
      // leaving settlement to a later timer can block realtime delivery forever.
      settleDisplayCommit(next.displayInstanceId, false);

      if (!displayStarted) {
        // A card that never started is a failed business-event presentation.
        scheduleQueueRecovery(false);
"""
          if text.count(old) != 1:
              raise SystemExit(f'expected one handleQueueError header, got {text.count(old)}')
          text = text.replace(old, new, 1)

          old = """        // This recovery path cannot reach the normal fallback/commit chain.
        // Settle the transport ACK explicitly before the bounded visual recovery;
        // otherwise a short display duration can unmount the card first and let
        // the later watchdog fail an already-advanced queue item implicitly.
        settleDisplayCommit(next.displayInstanceId, false);
        scheduleQueueRecovery(true);
"""
          new = """        // This recovery path cannot reach the normal fallback/commit chain;
        // the queue-level invariant above has already rejected its transport ACK.
        scheduleQueueRecovery(true);
"""
          if text.count(old) != 1:
              raise SystemExit(f'expected one early-recovery ACK block, got {text.count(old)}')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Run focused regression test
        run: npx vitest run tests/unit/components/overlay-page.test.tsx

      - name: Run typecheck
        run: npm run typecheck

      - name: Commit fix and remove one-off workflow
        run: |
          rm .github/workflows/tmp-pr1307-ack-invariant.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/overlay/'[streamerId]'/page.tsx .github/workflows/tmp-pr1307-ack-invariant.yml
          git commit -m "fix(overlay): queue例外でACKを必ず確定" -m "Refs #1002 #1307"
          git push origin HEAD:fix/1002-overlay-queue-recovery
