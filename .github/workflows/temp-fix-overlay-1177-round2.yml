name: Temporary overlay 1177 review fix

on:
  pull_request:
    types: [synchronize, reopened, ready_for_review]
    branches: [preview]

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.event.pull_request.head.ref == 'fix/overlay-nonblocking-image-metadata-1076'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply required review fixes
        run: python scripts/temp-fix-overlay-1177-round2.py
      - name: Install dependencies
        run: npm ci
      - name: Run overlay unit tests
        run: npx vitest run tests/unit/components/overlay-page.test.tsx
      - name: Typecheck
        run: npm run typecheck
      - name: Commit required fixes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "ChatGPT Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/overlay/'[streamerId]'/page.tsx tests/unit/components/overlay-page.test.tsx
          git commit -m "fix(overlay): address required review feedback (#1076)"
          git push origin HEAD:fix/overlay-nonblocking-image-metadata-1076
