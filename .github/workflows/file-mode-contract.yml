name: File mode contract

on:
  push:
    branches: [main, preview]
  pull_request:
    branches: [main, preview]

permissions:
  contents: read

jobs:
  file-mode:
    name: Reject executable source/config/doc files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 20 はサポート終了で 2026-10 のセキュリティ修正が出ないため、CI 用の
          # .github/ci-node-version（Workers Builds とは別に修正版へ完全固定）を参照する。
          # 理由は docs/cloudflare-workers-builds.md。Refs #1914 #1919
          node-version-file: .github/ci-node-version

      - name: Check tracked file modes
        run: node scripts/check-non-executable-file-modes.mjs
