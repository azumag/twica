# 読み取り専用の観測 workflow (Issue #1792 のトレード枚数フォールバック撤去判断の実測用 **production** 版)
#
# 目的:
#   PlanetScale の **production** 論理DBに対して **SELECT のみ** を実行し、#1789（譲 A×1 ⇄
#   求 B×N, 枚数指定）が導入した DB オブジェクトの実在を information_schema 経由で出力する。
#   対象は Issue #1792 で撤去対象とされたデプロイ窓フォールバックが守る2点のみ:
#     1. trade_offers.wanted_quantity 列（20261011120000）—— withTradeQuantityColumnFallback /
#        tradeOffersWithoutQuantity / acceptStateFor の withoutQuantity 系の撤去前提
#     2. 4引数版 public.accept_trade_offer 関数（20261011120000）—— 接続作成時の
#        accept_trade_offer 42883 フォールバック（3引数版への再試行）の撤去前提
#   #834（PR #953）が cards バトル8列の撤去前に information_schema 実測を必須前提とした、
#   #954（PR #1855）が cards 4列の撤去前に production と preview の双方で information_schema
#   実測を行った（フォールバックの撤去がトレード作成からマイトレードまで全経路に影響するため
#   prod 限定の裏付けでは不足）のと同じ手順を踏む。migration 適用記録ではなく現物の実測が根拠。
#
# なぜ preview 用 (db-readonly-check-trade-quantity.yml) と別ファイルなのか:
#   preview 用は「production の secret へ到達する経路を最初から作らない」ことを設計上の性質として
#   持つ（Environment を preview に固定し、input も持たない）。production を読む要件を同じ
#   ファイルへ足すと、その性質と input 無しの保証が壊れる。対象 Environment が違う観測は
#   ファイルを分け、**実行する SQL だけを一致させる**（一致は
#   tests/unit/db-readonly-check-trade-quantity-workflow.test.ts が機械的に固定する）。
#
# 安全設計:
#   - トリガは workflow_dispatch のみ。push / schedule / pull_request では動かない。
#   - **対象 Environment を production に固定**する。PLANETSCALE_DATABASE_URL は repo 直下ではなく
#     **Environment secret** なので、environment の宣言が無いと secret が解決せず DATABASE_URL が
#     空になる（planetscale-migrate.yml と同じ理由）。
#   - **ref は main のみ**を job 条件と step 内の二重で許可する。production の secret を使う経路を
#     既定ブランチへ限定し、feature branch のコードから production DB へ到達させない
#     （workflow_dispatch は任意 ref を選べるため、片方だけでは足りない）。
#   - セッション全体を読み取り専用にする（PGOPTIONS の default_transaction_read_only=on）。
#     誤って書き込み文が混ざっても DB 側で必ず失敗する。ワークフロー側の注意力に依存しない。
#     さらに**集計の前に接続先での実効 transaction_read_only を確認**し、on でなければ集計せず
#     失敗させる（オプション指定は「そう設定したつもり」にすぎないため）。
#   - 実行する SQL は本ファイルに固定で埋め込む。SQL を差し替える input は作らない。
#   - checkout しない（repo のコードを一切実行しない）。
#   - 公開ログを最小化する: 出力は information_schema の列・関数メタデータ・観測時刻・
#     テーブル名に絞り、行データや payload（視聴者情報を含みうる）は出力しない。
#     DB 名（current_database）は出力しない。接続文字列も echo しない。
#
# 実行方法:
#   workflow_dispatch は workflow が既定ブランチ（main）に存在する必要がある。
#     gh workflow run db-readonly-check-trade-quantity-production.yml --ref main
#   実測結果は実行時刻（observed_at / run URL）とセットで Issue #1792 に記録する。
name: "DB read-only check: trade quantity objects (production)"

on:
  workflow_dispatch: {}

# 同じ ref への連続実行はキューで待たせる（観測のみなのでキャンセルしない）。
concurrency:
  group: db-readonly-check-trade-quantity-production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  readonly-check:
    # workflow_dispatch は任意 ref を選べるため、job 開始前に main 以外を拒否する。
    # production の Environment secret を使う経路を既定ブランチに限定する。
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # production 固定。Environment secret の解決に必要（input では選ばせない）。
    environment: production
    timeout-minutes: 5
    env:
      DATABASE_URL: ${{ secrets.PLANETSCALE_DATABASE_URL }}
      # 読み取り専用 + 暴走防止。default_transaction_read_only は psql ではなくサーバ側で効く。
      PGOPTIONS: "-c default_transaction_read_only=on -c statement_timeout=60000 -c lock_timeout=5000"
    steps:
      # job-level の if に加えた多重防御。将来 if が編集されても、main 以外のコードから
      # production の DB secret を使わせない（feature branch を拒否する）。
      - name: Guard the target ref
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::the production read-only check is only allowed from refs/heads/main"
            exit 1
          fi

      # 読み取り結果の出所を記録する（secret は含まれない）。
      - name: Record provenance
        run: |
          echo "ref=$GITHUB_REF"
          echo "sha=$GITHUB_SHA"
          echo "run=$GITHUB_RUN_ID attempt=$GITHUB_RUN_ATTEMPT"

      # PGOPTIONS の指定は「そう設定したつもり」にすぎないため、接続先での**実効値**を確認する。
      # ここで on を確認できた場合にだけ観測へ進む（読み取り専用の強制はサーバ側で効く）。
      - name: Verify the session is read-only before aggregating
        run: |
          read_only=$(psql -X -qAt -v ON_ERROR_STOP=1 -d "$DATABASE_URL" -c "SHOW transaction_read_only")
          echo "transaction_read_only=$read_only"
          if [ "$read_only" != "on" ]; then
            echo "::error::expected transaction_read_only=on (PGOPTIONS default_transaction_read_only) but got '$read_only'"
            exit 1
          fi

      # Issue #1792 の撤去前提（trade_offers.wanted_quantity 列と 4引数版
      # accept_trade_offer 関数）の実在を確認する。
      # - 「対象列の実在」SELECT で列名・型・NULL可否・既定値を出力する（メタデータのみ）。
      # - 「欠落列」SELECT は列を左辺に固定列挙して欠落だけを明示する。0行なら実在。
      #   trade_offers テーブル自体が無い場合は全欠として現れる（to_regclass 行で判別する）。
      # - accept_trade_offer はオーバーロードしうるため routine + parameters で引数個数ごとに
      #   出力する（関数自体が無い場合は0行）。20261011120000 適用後は4引数の1行が望ましい。
      # この SQL は preview 用 (db-readonly-check-trade-quantity.yml) と **同一**に保つ。
      # 片方だけ直すと、環境ごとの実測根拠が乖離するため、一致は契約テスト
      # （tests/unit/db-readonly-check-trade-quantity-workflow.test.ts）が固定する。
      - name: Check trade quantity objects existence (read-only)
        run: |
          psql -X -v ON_ERROR_STOP=1 -d "$DATABASE_URL" <<'SQL'
          \pset pager off
          \echo ==== observation point (この実行時点の値) ====
          SELECT now() AS observed_at, current_setting('transaction_read_only') AS transaction_read_only;

          \echo ==== trade_offers テーブルの存在（存在しない場合は以降が全件欠落として現れる） ====
          SELECT to_regclass('public.trade_offers') AS trade_offers_table;

          \echo ==== wanted_quantity 列の実在（Issue #1792 / 20261011120000） ====
          SELECT column_name, data_type, is_nullable, column_default
          FROM information_schema.columns
          WHERE table_schema = 'public' AND table_name = 'trade_offers'
            AND column_name = 'wanted_quantity'
          ORDER BY column_name;

          \echo ==== 対象列のうち欠落しているもの（0行なら実在） ====
          SELECT t.name AS target_column
          FROM (VALUES ('wanted_quantity')) AS t(name)
          WHERE NOT EXISTS (
            SELECT 1
            FROM information_schema.columns c
            WHERE c.table_schema = 'public' AND c.table_name = 'trade_offers' AND c.column_name = t.name
          );

          \echo ==== accept_trade_offer のオーバーロード一覧（4引数版の実在が撤去前提。0行なら関数自体が無い） ====
          SELECT r.routine_name,
                 (
                   SELECT count(*)
                   FROM information_schema.parameters p
                   WHERE p.specific_schema = r.routine_schema
                     AND p.specific_name = r.specific_name
                 ) AS parameter_count,
                 r.data_type AS return_type
          FROM information_schema.routines r
          WHERE r.routine_schema = 'public'
            AND r.routine_name = 'accept_trade_offer'
          ORDER BY parameter_count;
          SQL
