name: AI fix PR 1212

on:
  push:
    branches:
      - codex/issue-989-structured-http-status

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Apply review fixes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected exactly one literal match, got {text.count(old)}')
              p.write_text(text.replace(old, new, 1))

          def regex_once(path, pattern, replacement):
              p = Path(path)
              text = p.read_text()
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one regex match, got {count}')
              p.write_text(updated)

          regex_once(
              'src/lib/error-handler.ts',
              r"const HTTP_STATUS_REASON_PHRASES = \{.*?\nexport async function handleBlobError",
              '''const HTTP_STATUS_REASON_PHRASES = {
  401: 'unauthorized',
  403: 'forbidden',
  429: 'too\\s+many\\s+requests',
  500: 'internal\\s+server\\s+error',
  502: 'bad\\s+gateway',
  503: 'service\\s+unavailable',
  504: 'gateway\\s+timeout',
  507: 'insufficient\\s+storage',
} as const

type HandledHttpStatus = keyof typeof HTTP_STATUS_REASON_PHRASES

// Issue #989: 裸の status 数値を部分一致させるとファイル名や URL まで誤認するため、
// 明示的な HTTP/status ラベルか標準的な status line だけを受理する。
function hasHttpStatusContext(errorMessage: string, status: HandledHttpStatus): boolean {
  const reasonPhrase = HTTP_STATUS_REASON_PHRASES[status]
  return new RegExp(
    `(?:\\\\bhttp(?:\\\\/[0-9.]+)?\\\\s+${status}\\\\b|\\\\bstatus(?:\\\\s*code)?\\\\s*[:=]?\\\\s*${status}\\\\b|\\\\bhttpstatuscode\\\\s*[:=]?\\\\s*${status}\\\\b|(?:^|[\\\\s:(\\\\[])${status}\\\\s+${reasonPhrase}\\\\b)`,
    'i'
  ).test(errorMessage)
}

function getExplicitHttpStatus(errorMessage: string): HandledHttpStatus | undefined {
  const statuses = Object.keys(HTTP_STATUS_REASON_PHRASES).map(Number) as HandledHttpStatus[]
  return statuses.find((status) => hasHttpStatusContext(errorMessage, status))
}

export async function handleBlobError'''
          )

          regex_once(
              'src/lib/error-handler.ts',
              r"export async function handleBlobError\(error: unknown, context: string, additionalInfo\?: Record<string, unknown>\): Promise<NextResponse> \{.*?\n\}\n\n// Note: uploadWithRetry",
              '''export async function handleBlobError(error: unknown, context: string, additionalInfo?: Record<string, unknown>): Promise<NextResponse> {
  const errorMessage = error instanceof Error ? error.message : String(error)
  const normalizedErrorMessage = errorMessage.toLowerCase()
  const explicitHttpStatus = getExplicitHttpStatus(errorMessage)
  await logAndRecordError(`${context}: ${errorMessage}`, error, additionalInfo)

  // Issue #989: S3 SDK の structured status は r2-client が `HTTP <status>:` へ正規化して
  // この境界まで伝搬する。明示 status を message キーワードより先に評価し、一次情報を優先する。
  if (explicitHttpStatus === 507) {
    return NextResponse.json({ error: 'Storage quota exceeded' }, { status: 507 })
  }

  if (explicitHttpStatus === 401 || explicitHttpStatus === 403) {
    return NextResponse.json({ error: 'Storage authentication failed' }, { status: 503 })
  }

  if ([429, 500, 502, 503, 504].includes(explicitHttpStatus ?? -1)) {
    return NextResponse.json({ error: 'Storage service temporarily unavailable' }, { status: 503 })
  }

  if (normalizedErrorMessage.includes('quota') || normalizedErrorMessage.includes('limit')) {
    return NextResponse.json({ error: 'Storage quota exceeded' }, { status: 507 })
  }

  if (
    normalizedErrorMessage.includes('authentication') ||
    normalizedErrorMessage.includes('unauthorized') ||
    normalizedErrorMessage.includes('accessdenied') ||
    normalizedErrorMessage.includes('invalidaccesskeyid') ||
    normalizedErrorMessage.includes('signaturedoesnotmatch')
  ) {
    return NextResponse.json({ error: 'Storage authentication failed' }, { status: 503 })
  }

  if (
    normalizedErrorMessage.includes('service unavailable') ||
    normalizedErrorMessage.includes('slowdown')
  ) {
    return NextResponse.json({ error: 'Storage service temporarily unavailable' }, { status: 503 })
  }

  return NextResponse.json({ error: ERROR_MESSAGES.INTERNAL_ERROR }, { status: 500 })
}

// Note: uploadWithRetry'''
          )

          insert_after = '''export function isTransientR2Error(errorMessage: string): boolean {
  return TRANSIENT_R2_ERROR_PATTERNS.some(pattern =>
    typeof pattern === 'string'
      ? errorMessage.toLowerCase().includes(pattern.toLowerCase())
      : pattern.test(errorMessage)
  );
}
'''
          helper = insert_after + '''
// Issue #989: S3 SDK v3 の構造化 status は raw error が生きているこの境界で読み取る。
// upload route は retry helper の文字列結果だけを受け取るため、status を安定した `HTTP <code>:`
// 形式へ正規化してから返し、handleBlobError まで情報を失わず伝搬する。R2 native は従来どおり
// message ベース判定へフォールバックする。
function getStructuredHttpStatusCode(error: unknown): number | undefined {
  if (typeof error !== 'object' || error === null || !('$metadata' in error)) return undefined;

  const metadata = (error as { $metadata?: unknown }).$metadata;
  if (typeof metadata !== 'object' || metadata === null || !('httpStatusCode' in metadata)) {
    return undefined;
  }

  const code = (metadata as { httpStatusCode?: unknown }).httpStatusCode;
  return typeof code === 'number' && Number.isInteger(code) && code >= 100 && code <= 599
    ? code
    : undefined;
}

function formatR2UploadError(error: unknown): string {
  const message = error instanceof Error ? error.message : String(error);
  const status = getStructuredHttpStatusCode(error);
  return status === undefined ? message : `HTTP ${status}: ${message}`;
}

function isTransientStructuredR2Error(error: unknown): boolean {
  const status = getStructuredHttpStatusCode(error);
  return status === 429 || (status !== undefined && status >= 500 && status <= 599 && status !== 507);
}
'''
          replace_once('src/lib/r2-client.ts', insert_after, helper)

          replace_once(
              'src/lib/r2-client.ts',
              '''      const errorMessage = error instanceof Error ? error.message : String(error);\n\n      // 一時的なエラーかどうかを判定（R2固有コード・ネットワークエラーとも、ここが唯一のリトライ層）\n      const isTransient = isTransientR2Error(errorMessage);''',
              '''      const errorMessage = formatR2UploadError(error);\n\n      // S3 SDK は structured status を一次情報として使い、R2 native は従来の message 判定へフォールバックする。\n      const isTransient = isTransientStructuredR2Error(error) || isTransientR2Error(errorMessage);'''
          )

          old_structured_tests = '''    it.each([\n      [401, 503, 'Storage authentication failed'],\n      [503, 503, 'Storage service temporarily unavailable'],\n      [507, 507, 'Storage quota exceeded'],\n    ])('$metadata.httpStatusCode=%s を文字列解析より優先する', async (httpStatusCode, expectedStatus, expectedError) => {\n      const error = Object.assign(new Error('opaque SDK failure'), {\n        $metadata: { httpStatusCode },\n      });\n      const response = await handleBlobError(error, 'blob');\n      expect(response.status).toBe(expectedStatus);\n\n      const body = await response.json();\n      expect(body.error).toBe(expectedError);\n    });\n\n    it('構造化statusがある場合は矛盾するmessageキーワードで上書きしない', async () => {\n      const error = Object.assign(new Error('Service Unavailable'), {\n        $metadata: { httpStatusCode: 500 },\n      });\n      const response = await handleBlobError(error, 'blob');\n      expect(response.status).toBe(500);\n    });\n'''
          new_structured_tests = '''    it.each([\n      ['HTTP 401: opaque SDK failure', 503, 'Storage authentication failed'],\n      ['HTTP 403: AccessDenied', 503, 'Storage authentication failed'],\n      ['HTTP 429: SlowDown', 503, 'Storage service temporarily unavailable'],\n      ['HTTP 500: Internal Server Error', 503, 'Storage service temporarily unavailable'],\n      ['HTTP 502: Bad Gateway', 503, 'Storage service temporarily unavailable'],\n      ['HTTP 503: Service Unavailable', 503, 'Storage service temporarily unavailable'],\n      ['HTTP 504: Gateway Timeout', 503, 'Storage service temporarily unavailable'],\n      ['HTTP 507: Insufficient Storage', 507, 'Storage quota exceeded'],\n    ])('r2-client が伝搬した明示 HTTP status を優先する: %s', async (errorMessage, expectedStatus, expectedError) => {\n      const response = await handleBlobError(new Error(errorMessage), 'blob');\n      expect(response.status).toBe(expectedStatus);\n\n      const body = await response.json();\n      expect(body.error).toBe(expectedError);\n    });\n\n    it('明示HTTP statusは矛盾するmessageキーワードより優先する', async () => {\n      const response = await handleBlobError(new Error('HTTP 500: Unauthorized'), 'blob');\n      expect(response.status).toBe(503);\n\n      const body = await response.json();\n      expect(body.error).toBe('Storage service temporarily unavailable');\n    });\n'''
          replace_once('tests/unit/error-handler.test.ts', old_structured_tests, new_structured_tests)

          replace_once(
              'tests/unit/r2-client-retry-loop.test.ts',
              "import { withR2UploadRetry } from '@/lib/r2-client'\n",
              "import { withR2UploadRetry } from '@/lib/r2-client'\nimport { handleBlobError } from '@/lib/error-handler'\n"
          )

          insertion = '''\n  it('S3 SDKのstructured 403を認証失敗としてroute境界まで伝搬する', async () => {\n    const error = Object.assign(new Error('AccessDenied: invalid credentials'), {\n      $metadata: { httpStatusCode: 403 },\n    })\n    const upload = vi.fn<() => Promise<string>>().mockRejectedValue(error)\n    const sleep = vi.fn().mockResolvedValue(undefined)\n\n    const result = await withR2UploadRetry('[R2]', upload, 3, sleep)\n    expect(result).toEqual({ error: 'HTTP 403: AccessDenied: invalid credentials' })\n    expect(upload).toHaveBeenCalledTimes(1)\n    expect(sleep).not.toHaveBeenCalled()\n\n    if (!('error' in result)) throw new Error('expected upload error')\n    const response = await handleBlobError(new Error(result.error), 'blob')\n    expect(response.status).toBe(503)\n    await expect(response.json()).resolves.toMatchObject({ error: 'Storage authentication failed' })\n  })\n\n  it('S3 SDKのstructured 429はmessageが不透明でも一時障害としてリトライする', async () => {\n    const error = Object.assign(new Error('opaque SDK failure'), {\n      $metadata: { httpStatusCode: 429 },\n    })\n    const upload = vi.fn<() => Promise<string>>()\n      .mockRejectedValueOnce(error)\n      .mockResolvedValueOnce('https://example.test/image.png')\n    const sleep = vi.fn().mockResolvedValue(undefined)\n\n    await expect(withR2UploadRetry('[R2]', upload, 1, sleep)).resolves.toEqual({\n      url: 'https://example.test/image.png',\n    })\n    expect(upload).toHaveBeenCalledTimes(2)\n    expect(sleep).toHaveBeenCalledWith(1000)\n  })\n\n  it('structured statusの異常値は一次情報として扱わず従来messageへフォールバックする', async () => {\n    const error = Object.assign(new Error('AccessDenied: invalid credentials'), {\n      $metadata: { httpStatusCode: 999 },\n    })\n    const upload = vi.fn<() => Promise<string>>().mockRejectedValue(error)\n    const sleep = vi.fn().mockResolvedValue(undefined)\n\n    await expect(withR2UploadRetry('[R2]', upload, 3, sleep)).resolves.toEqual({\n      error: 'AccessDenied: invalid credentials',\n    })\n    expect(upload).toHaveBeenCalledTimes(1)\n  })\n'''
          p = Path('tests/unit/r2-client-retry-loop.test.ts')
          text = p.read_text()
          if not text.endswith('})\n'):
              raise SystemExit('unexpected retry-loop test ending')
          p.write_text(text[:-3] + insertion + '})\n')
          PY
      - name: Targeted tests
        run: npx vitest run --cache=false tests/unit/error-handler.test.ts tests/unit/r2-client-retry-loop.test.ts
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Commit review fix
        shell: bash
        run: |
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/lib/error-handler.ts src/lib/r2-client.ts tests/unit/error-handler.test.ts tests/unit/r2-client-retry-loop.test.ts
          git commit -m "fix(r2): propagate structured status through upload retry"
          git push origin HEAD:codex/issue-989-structured-http-status
