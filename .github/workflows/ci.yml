name: CI

on:
  push:
    branches: [ main, preview ]
  pull_request:
    branches: [ main, preview ]

# 変更ファイルの検出は job 単位で行う。workflow レベルの paths フィルタは
# 全 job へ一律適用される上、required check が「報告待ち」で詰まったまま
# マージをブロックし続ける既知の落とし穴があるため使わない。
# dorny/paths-filter で job ごとに必要なファイル群を判定し、無関係な変更では
# その job だけスキップする（skip された required check は成功扱いになる）。
jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      app: ${{ steps.filter.outputs.app }}
      tests: ${{ steps.filter.outputs.tests }}
      scripts: ${{ steps.filter.outputs.scripts }}
      migrations: ${{ steps.filter.outputs.migrations }}
      postgres_fixtures: ${{ steps.filter.outputs.postgres_fixtures }}
      analysis: ${{ steps.filter.outputs.analysis }}
      i18n: ${{ steps.filter.outputs.i18n }}
    steps:
      - uses: actions/checkout@v4
        with:
          # push イベントでは直前コミットとの差分検出に履歴が必要
          # （PR イベントでは REST API を使うため不要だが、両対応で常に取得する）
          fetch-depth: 0
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # push: 同一ブランチの直前コミットとの差分 / PR: base ブランチとの差分
          # （PR イベントではこの入力は無視される）
          base: ${{ github.ref }}
          filters: |
            app:
              - 'src/**'
              - 'workers/**'
              - 'messages/**'
              - 'public/**'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig*.json'
              - 'next.config.*'
              - 'open-next.config.*'
              - 'postcss.config.*'
              - 'eslint*.config.*'
              - 'vitest.config.*'
              - 'wrangler.toml'
            tests:
              - 'tests/**'
            scripts:
              - 'scripts/**'
              - 'config/**'
            migrations:
              - 'supabase/migrations/**'
              - 'db/planetscale/**'
              - 'scripts/db-migrate.js'
              - 'scripts/lib/**'
              - 'scripts/check-migration-order.js'
            postgres_fixtures:
              - 'tests/fixtures/analysis-dashboard-pagination-postgres.sql'
              - 'tests/fixtures/transactional-chat-outbox-postgres.sql'
              - 'tests/fixtures/transactional-chat-outbox-concurrency.sh'
            analysis:
              - 'analysis/**'
              - 'scripts/check-analysis-browser-supabase.js'
            i18n:
              - 'src/**'
              - 'eslint.i18n.config.mjs'
              - 'scripts/i18n-debt-files.js'

  test:
    needs: changes
    # アプリ/テスト/スクリプト/migration のいずれにも触れない変更
    # （ドキュメント等）ではスキップする。migration を含めるのは unit test が
    # migration SQL を読み込むため（tests/unit/migration-filenames.test.ts 等）。
    if: >-
      needs.changes.outputs.app == 'true' ||
      needs.changes.outputs.tests == 'true' ||
      needs.changes.outputs.scripts == 'true' ||
      needs.changes.outputs.migrations == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        id: typecheck
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee typecheck-output.log

      - name: Typecheck overlay realtime Worker
        run: npm run overlay-realtime:typecheck

      - name: Upload failed typecheck output
        if: steps.typecheck.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-output
          path: typecheck-output.log
          if-no-files-found: error
          retention-days: 7

      - name: Supabase shutdown independence check
        # Static boundary check: runtime/browser/deploy paths must remain usable
        # after the Supabase project and all URL/key secrets are deleted.
        run: npm run check:supabase-shutdown

      - name: Maintenance write surface check
        run: npm run check:maintenance-surfaces

      - name: Unit tests
        run: npm run test:unit -- --reporter=json --outputFile=vitest-report.json --bail=1

      - name: Upload failed unit test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-unit-report
          path: vitest-report.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Integration tests
        run: npm run test:integration

  supabase-shutdown-build:
    name: Application build without Supabase variables
    needs: [changes, test]
    # test 成功時のみ（スキップ時も可）。app/scripts に触れない変更ではスキップ。
    # test がスキップされるのは app/scripts 未変更時なので、結果的に
    # 元の「test が失敗/キャンセルしたら回さない」を維持する。
    if: >-
      needs.test.result == 'success' &&
      (needs.changes.outputs.app == 'true' ||
       needs.changes.outputs.scripts == 'true')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build deployable Worker without Supabase URL or keys
        # `next build` だけでは OpenNext の middleware / Worker 成果物を生成しない。
        # 本番へ出すのと同じ build を使い、生成段階で旧 provider が混入する回帰も検査する。
        run: npm run workers:build
        env:
          NEXT_PUBLIC_VERSION: ${{ github.sha }}
          NEXT_PUBLIC_TWITCH_CLIENT_ID: dummy_client_id
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          TWITCH_CLIENT_ID: dummy_client_id
          TWITCH_CLIENT_SECRET: dummy_client_secret
          TWITCH_EVENTSUB_SECRET: dummy_eventsub_secret
          CSRF_TOKEN_SALT: dummy_csrf_salt_at_least_32_chars_long

      - name: Build production and preview auxiliary Worker bundles
        # Wranglerの実deployと同じbundler/config解決をdry-runし、source scan後に
        # conditional exportやpluginが旧providerを注入する回帰も検査対象にする。
        run: npm run auxiliary-workers:build

      - name: Verify every generated deploy artifact is Supabase-independent
        # 両フラグは成果物のsilent skipを禁止する。outdirやbuild stepが変わった場合も
        # 検査成功にはせず、deploy boundaryの明示更新を要求する。
        run: npm run check:supabase-shutdown -- --require-open-next --require-aux-workers

  analysis:
    name: Analysis dashboard (guard / typecheck / build)
    needs: changes
    if: needs.changes.outputs.analysis == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            analysis/package-lock.json

      - name: Browser Supabase dependency guard
        run: node scripts/check-analysis-browser-supabase.js

      - name: Install analysis dependencies
        run: npm ci
        working-directory: analysis

      - name: Typecheck analysis
        run: npx tsc --noEmit
        working-directory: analysis

      - name: Build analysis
        run: npm run build
        working-directory: analysis

      - name: Verify built bundle has no Supabase string
        run: |
          shopt -s nullglob
          bundle_files=(analysis/dist/assets/*.js)
          if [ ${#bundle_files[@]} -eq 0 ]; then
            echo "::error::analysis/dist/assets/*.js にJSファイルが見つかりません。ビルド成果物の出力先が変わっていないか確認してください。"
            exit 1
          fi
          if grep -ril "supabase" "${bundle_files[@]}"; then
            echo "::error::analysis の本番bundleに'supabase'という文字列が含まれています。上記ファイルを確認してください。"
            exit 1
          fi
          echo "OK: bundleにSupabase文字列は含まれていません (${#bundle_files[@]} ファイルを検証)"

  lint:
    needs: changes
    if: >-
      github.event_name == 'pull_request' &&
      github.base_ref == 'main' &&
      github.head_ref == 'preview' &&
      (needs.changes.outputs.app == 'true' ||
       needs.changes.outputs.tests == 'true' ||
       needs.changes.outputs.scripts == 'true')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  lint-i18n:
    name: Lint i18n (Japanese literals)
    needs: changes
    # PRだけでなく、preview/mainへマージされたpushでも同じガードを実行する。
    # PR側のイベントが欠落した場合でも、デプロイ対象のコミットで回帰を検出できるようにする。
    if: >-
      (github.event_name == 'pull_request' || github.event_name == 'push') &&
      needs.changes.outputs.i18n == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # ハードコード日本語リテラルの回帰防止（#835）。負債リスト
      # （scripts/i18n-debt-files.js）に無いファイルで日本語リテラルを追加すると失敗する。
      - name: Lint i18n
        run: npm run lint:i18n

  migration-order-check:
    name: Migration order check
    needs: changes
    if: needs.changes.outputs.migrations == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch base branch
        run: git fetch origin ${{ github.base_ref }}

      - name: Check migration order
        run: npm run check:migration-order -- --base=origin/${{ github.base_ref }}

  planetscale-migration-postgres:
    name: PlanetScale migration PostgreSQL 17
    needs: changes
    if: >-
      needs.changes.outputs.migrations == 'true' ||
      needs.changes.outputs.postgres_fixtures == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Apply PlanetScale baseline and additive migrations
        # SQL文字列テストではPL/pgSQLの構文や三値論理を検証できない。実運用と同じ
        # PostgreSQL 17へ各ファイルをdescriptorのtransaction指定どおりに
        # 順序適用し、途中の1ファイルでも失敗したらON_ERROR_STOPでjobを停止する。
        # CREATE INDEX CONCURRENTLYを含むforbidden migrationだけは
        # トランザクション外で実行し、実運用のdb-migrate.jsと同じ実行条件を検証する。
        env:
          PGPASSWORD: postgres
        run: |
          psql -X -1 -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d postgres \
            -f db/planetscale/migrations/20260719180000_planetscale_bootstrap.sql
          psql -X -1 -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d postgres \
            -f db/planetscale/migrations/20260719180100_planetscale_public_schema_baseline.sql
          psql -X -1 -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d postgres \
            -f db/planetscale/grants.sql
          # runtime migration runnerと同じdescriptor parserで、共通migrationと
          # PlanetScale専用migrationをマージ・provider filter・名前順sortする。
          # CIだけ別の対象集合を再実装すると、新しい共通migrationを見落とすため。
          # process substitution (`done < <(node ...)`)では、nodeがdescriptor解析に
          # 失敗してもwhile側の終了コードだけが残り、GitHub Actionsの`set -e`が
          # エラーを見逃す。先にcommand substitutionの代入を完了させることで、
          # nodeの非0終了をこのstepの失敗として伝播させ、DDL適用へ進ませない。
          migration_descriptors="$(node -e "
            const path = require('node:path');
            const core = require('./scripts/lib/db-migrate-core');
            const descriptors = core.loadMigrationFilesFromDirs([
              path.resolve('supabase/migrations'),
              path.resolve('db/planetscale/migrations'),
            ]);
            const errors = core.collectDescriptorErrors(descriptors);
            if (errors.length > 0) throw new Error(JSON.stringify(errors));
            for (const descriptor of descriptors) {
              if (
                BigInt(descriptor.version) > 20260719180100n
                && core.isProviderApplicable(descriptor, 'planetscale')
              ) {
                console.log(descriptor.transaction + '\\t' + path.join(descriptor.sourceDir, descriptor.filename));
              }
            }
          ")"
          if [ -n "$migration_descriptors" ]; then
            while IFS=$'\t' read -r transaction migration; do
              if [ "$transaction" = "forbidden" ]; then
                psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d postgres \
                  -f "$migration"
              else
                psql -X -1 -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d postgres \
                  -f "$migration"
              fi
            done <<< "$migration_descriptors"
          fi

      - name: Verify analysis dashboard pagination RPCs
        # SQLの文字列検査だけでは、ページ行・count・summaryの整合性や
        # SECURITY DEFINER RPCの実行可否を保証できない。CI用の一時DBへfixtureを
        # 同一トランザクションで投入し、実際に各RPCを呼び出してからROLLBACKする。
        env:
          PGPASSWORD: postgres
        run: |
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d postgres \
            -f tests/fixtures/analysis-dashboard-pagination-postgres.sql

      - name: Verify transactional gacha outbox invariants
        # 旧RPC互換、single/N連、歯抜け復旧、NULL副作用0、権限、lease fencingを
        # 実DBで検証し、新RPC欠落による全ガチャfail-closedをPR段階で防ぐ。
        env:
          PGPASSWORD: postgres
        run: |
          psql -X -1 -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d postgres \
            -f tests/fixtures/transactional-chat-outbox-postgres.sql

      - name: Verify concurrent duplicate fencing
        # 先行COMMIT前に同じeventを別接続から実行し、同じcard/別cardのどちらでも
        # 後続がlimit_reachedではなくduplicateへ収束することを確認する。
        env:
          PGPASSWORD: postgres
        run: bash tests/fixtures/transactional-chat-outbox-concurrency.sh
