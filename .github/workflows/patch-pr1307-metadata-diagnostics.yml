name: Patch PR 1307 metadata diagnostics

on:
  push:
    branches:
      - fix/1002-overlay-queue-recovery

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/1002-overlay-queue-recovery

      - name: Keep presentation diagnostics from escaping
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/app/overlay/[streamerId]/page.tsx')
          text = path.read_text(encoding='utf-8')

          old = '''      ).catch((error) => {
        // Metadata is optional presentation data; a probe failure must not drop
        // or advance the business-event queue after the card has started.
        logger.warn("Overlay image metadata probe failed:", error);
        addDebugLogRef.current(
          `image metadata probe failed: ${error instanceof Error ? error.message : String(error)}`
        );
      });'''
          new = '''      ).catch((error) => {
        // Metadata and its diagnostics are presentation-only. A broken logger
        // or debug panel must not reject this already-handled Promise and leak
        // into handleQueueError after the normal advance chain is armed.
        try {
          logger.warn("Overlay image metadata probe failed:", error);
        } catch {
          // Best-effort diagnostic only.
        }
        try {
          addDebugLogRef.current(
            `image metadata probe failed: ${error instanceof Error ? error.message : String(error)}`
          );
        } catch {
          // Best-effort debug UI only.
        }
      });'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one metadata catch, got {text.count(old)}')
          text = text.replace(old, new, 1)

          old = '''      } catch (error) {
        logger.warn("Overlay effect setup failed; using no effect:", error);
        addDebugLogRef.current(
          `effect setup failed: ${error instanceof Error ? error.message : String(error)}`
        );
        setActiveEffectStyle("none");
        setEffectParticles([]);
      }'''
          new = '''      } catch (error) {
        // Effect setup is presentation-only. Apply the safe fallback before
        // best-effort diagnostics so logger/debug failures cannot escape into
        // the queue-level error boundary either.
        setActiveEffectStyle("none");
        setEffectParticles([]);
        try {
          logger.warn("Overlay effect setup failed; using no effect:", error);
        } catch {
          // Best-effort diagnostic only.
        }
        try {
          addDebugLogRef.current(
            `effect setup failed: ${error instanceof Error ? error.message : String(error)}`
          );
        } catch {
          // Best-effort debug UI only.
        }
      }'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one effect catch, got {text.count(old)}')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit fix and remove one-off workflow
        run: |
          rm .github/workflows/patch-pr1307-metadata-diagnostics.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/overlay/[streamerId]/page.tsx .github/workflows/patch-pr1307-metadata-diagnostics.yml
          git commit -m "fix(overlay): presentation診断をqueue境界から隔離" -m "Refs #1002 #1307"
          git push origin HEAD:fix/1002-overlay-queue-recovery
