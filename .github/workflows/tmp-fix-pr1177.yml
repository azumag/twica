name: Temporary PR 1177 mandatory fix

on:
  pull_request:
    branches:
      - preview
    types:
      - synchronize

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'fix/overlay-nonblocking-image-metadata-1076'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/overlay-nonblocking-image-metadata-1076
      - name: Apply mandatory review fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/app/overlay/[streamerId]/page.tsx')
          text = path.read_text()

          marker = '// Show card after brief delay'
          marker_pos = text.index(marker)
          reveal_line_start = text.rfind('\n', 0, marker_pos) + 1
          reveal_indent = text[reveal_line_start:marker_pos]
          show_pos = text.index('setShowCard(true);', marker_pos)
          reveal_line_end = text.index('\n', show_pos) + 1
          old_reveal = text[reveal_line_start:reveal_line_end]
          if 'imageLayoutGenerationRef.current += 1;' not in old_reveal:
              raise SystemExit('reveal block no longer contains generation invalidation')
          new_reveal = (
              f"{reveal_indent}// Show card after brief delay. Keep this card's metadata generation valid\n"
              f"{reveal_indent}// until the card is replaced so slower CDN/OBS metadata can still enable\n"
              f"{reveal_indent}// autoPortrait/smallMode instead of being discarded after only 100ms.\n"
              f"{reveal_indent}animationTimeoutRef.current = setTimeout(() => runProtected(() => {{\n"
              f"{reveal_indent}  setShowCard(true);\n"
          )
          text = text[:reveal_line_start] + new_reveal + text[reveal_line_end:]

          hide_marker = '// Hide after display, then process next queued item'
          hide_pos = text.index(hide_marker)
          result_pos = text.index('setResult(null);', hide_pos)
          result_line_start = text.rfind('\n', 0, result_pos) + 1
          result_indent = text[result_line_start:result_pos]
          insertion = (
              f"{result_indent}// The outgoing card may accept late metadata while it is still current,\n"
              f"{result_indent}// but once it is removed its callbacks must not affect the next card.\n"
              f"{result_indent}if (imageLayoutGenerationRef.current === imageLayoutGeneration) {{\n"
              f"{result_indent}  imageLayoutGenerationRef.current += 1;\n"
              f"{result_indent}}}\n"
          )
          text = text[:result_line_start] + insertion + text[result_line_start:]
          path.write_text(text)

          Path('.github/workflows/tmp-fix-pr1177.yml').unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/overlay/'[streamerId]'/page.tsx .github/workflows/tmp-fix-pr1177.yml
          git diff --cached --check
          git commit -m "fix(overlay): preserve metadata layout after reveal"
          git push origin HEAD:fix/overlay-nonblocking-image-metadata-1076
