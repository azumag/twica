# Temporary one-shot workflow; removes itself after applying the fix.
name: Apply PR 1177 image remount fix

on:
  push:
    branches:
      - fix/overlay-nonblocking-image-metadata-1076

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/overlay-nonblocking-image-metadata-1076
          fetch-depth: 0

      - name: Apply required review fix
        run: python .github/scripts/ai-fix-pr1177-image-remount.py

      - name: Remove temporary patch helpers
        run: git rm .github/workflows/ai-fix-pr1177-image-remount.yml .github/scripts/ai-fix-pr1177-image-remount.py

      - name: Commit required fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/overlay/'[streamerId]'/page.tsx tests/unit/components/overlay-page.test.tsx
          git commit -m "fix(overlay): remount card DOM per queued display (#1177)"
          git push origin HEAD:fix/overlay-nonblocking-image-metadata-1076
