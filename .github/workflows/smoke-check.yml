# Post-deploy Smoke Check (#536)
# デプロイ後スモークテスト
#
# Cloudflare Workers Builds は GitHub Actions とは独立して Git push をトリガーに
# デプロイを実行するため、「Supabase マイグレーション成功をデプロイの条件にする」
# 真のデプロイゲートはこのアーキテクチャ上実現できない (#536 で検討済み、既存の
# Cloudflare Workers Builds 連携を崩さずに実現する方法がないため見送り)。
#
# 代わりに、本番デプロイ後 最大15分以内に主要ページとDBスキーマの整合性を
# 定期チェックし、異常があれば GitHub Issue でアラートする「検知して知らせる」
# 方式を採用する。デプロイを自動でブロック・ロールバックするものではない
# (ALERTのみ)。#525-527 のようにコードがマイグレーション未適用のDB列/テーブルを
# 前提にしてしまう事故を、本番影響が続く前に検知することが目的。
#
# See also: docs/cloudflare-workers-builds.md
# ("Operational Runbook: Repairing Migration History")
#
# 必要な Secrets (Production 環境, Settings → Environments → Production):
#   - NEXT_PUBLIC_SUPABASE_URL: 既存の Production 環境シークレットを再利用。
#   - SUPABASE_SECRET_KEY (または レガシー名の SUPABASE_SERVICE_ROLE_KEY):
#     DBスキーマチェック用の Supabase 管理者キー。
#     この Environment には本ワークフロー作成時点でまだ設定されていないため、
#     有効化前に追加が必要 (追加するまではDBスキーマチェックが失敗として
#     報告され続ける — これはフェイルセーフとして意図した挙動であり、
#     チェックを静かにスキップしない)。
#
# 定期実行 (schedule) は無効化済み (2026-07-17):
#   2026-07-04 の運用開始からは正常に成功し続けていたが、2026-07-16 23:52 JST
#   (14:52 UTC) のコミット d327554 (コミットメッセージは「update CLAUDE」だが、
#   実際の変更内容は package-lock.json のみ・119行削除) により
#   `@swc/helpers@0.5.23` 等の依存が lock file から欠落した。以降、
#   `npm run smoke-check` に到達する前の `npm ci` の時点で全実行が失敗する
#   ようになり (Install dependencies ステップの
#   `npm error Missing: @swc/helpers@0.5.23 from lock file`)、本来の
#   スモークテスト本体もインシデントIssue作成も一切動かないまま設定上15分
#   ごと (実際の起動間隔はGitHub側のスケジューラ遅延で最大1時間強) に
#   CI実行時間だけを消費し続けていた
#   (2026-07-16 15:19 UTC 以降の全実行が失敗、それ以前は成功)。
#   なお同じ lock file 不整合は `ci.yml` (push/PR) や
#   `deploy-cloudflare.yml` の `npm ci` にも影響しており、
#   package-lock.json の再同期はこのワークフロー固有ではなく別途対応が必要
#   だったため、直前コミットの package-lock.json を復元して対応済み。
#
#   さらに調査の過程で、上記の lock file 問題とは別に「Run smoke check」
#   ステップに `pipefail` 欠如のバグがあり、運用開始から一度も本当の失敗を
#   検知できていなかったことが判明した (詳細は同ステップのコメント参照)。
#   このバグ自体は修正済みだが、DBスキーマチェックに必要な
#   `SUPABASE_SECRET_KEY` (または `SUPABASE_SERVICE_ROLE_KEY`) が
#   Production 環境に依然として未設定であることも同時に判明したため、
#   schedule はあえて再有効化していない (今再有効化すると、15分ごとに
#   このバグ修正で初めて正しく検知されるようになった既知の未設定を
#   インシデントIssueとして報告し続けてしまうため)。
#   Production 環境に上記 Secrets を設定し、`workflow_dispatch` の手動実行で
#   全チェックが成功する (`OK: N 件のチェックに全て成功しました` が出力され
#   ジョブが green になる) ことを確認してから、下の schedule ブロックを
#   アンコメントして再度有効化すること。
name: Smoke Check

on:
  # 定期実行は上記の理由により無効化中 (2026-07-17)。再有効化する際は
  # 以下2行をアンコメントするだけでよい (元の頻度: 15分ごと、UTC)。
  # schedule:
  #   - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      base_url:
        description: "チェック対象のベースURL (空欄なら本番URLを使用)"
        required: false
        default: ""

# schedule 再有効化後は「前回実行が長引いていても15分ごとの新規実行が
# 積み重ならないようにする」ための設定。手動実行 (workflow_dispatch) の
# 多重起動防止も兼ねるため、無効化中も維持する。
concurrency:
  group: smoke-check
  cancel-in-progress: false

jobs:
  smoke-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # NEXT_PUBLIC_SUPABASE_URL 等、既存の Production 環境シークレットを再利用する
    environment: production
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # continue-on-error + 後続ステップでの outcome 判定により、失敗時も
      # Issue 作成ステップまでワークフローを継続させる。
      #
      # `set -o pipefail` が必須 (2026-07-17 発見): GitHub Actions の run
      # ステップはデフォルトで `bash -e` のみで起動され `pipefail` は有効化
      # されない。`npm run smoke-check | tee ...` のようにパイプを使うと、
      # シェルが報告する終了コードはパイプ最後の `tee` のもの (ほぼ常に0)
      # になり、smoke-check.js が `process.exit(1)` してもこのステップは
      # 常に success 扱いになってしまう。実際、運用開始 (2026-07-04) から
      # 一度も steps.smoke.outcome が 'failure' になったことがなく、
      # 後続の Issue 作成/ジョブ失敗ステップは常に skip されていた
      # (npm ci が通っていた期間の全実行で、スモークテスト自体は内部で
      # `NG: 1/3 件のチェックに失敗しました - schema-checks: ... SUPABASE_SECRET_KEY`
      # を報告し続けていたが、これが一度も外部に伝わっていなかった)。
      - name: Run smoke check
        id: smoke
        continue-on-error: true
        run: |
          set -o pipefail
          npm run smoke-check 2>&1 | tee smoke-check-output.log
        env:
          SMOKE_TEST_BASE_URL: ${{ github.event.inputs.base_url }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # 失敗時のみ実行。同一の障害で15分ごとにIssueが乱立しないよう、
      # "production-incident" ラベル + 固定タイトルで既存のオープンIssueを検索し、
      # あればコメント追記、無ければ新規作成する (シンプルな重複防止。
      # これはあくまでアラート機構であり、厳密な重複排除は行わない)。
      - name: File or update incident issue on failure
        if: steps.smoke.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TITLE="[smoke-check] 本番スモークテストが失敗しています"
          BODY_FILE="$(mktemp)"
          {
            echo "## 自動検知: 本番スモークテスト失敗 (#536)"
            echo ""
            echo "- Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- Detected at: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo ""
            echo '```'
            cat smoke-check-output.log
            echo '```'
            echo ""
            echo "このIssueは \`.github/workflows/smoke-check.yml\` (#536) により自動生成/更新されました。"
            echo "デプロイを自動でブロック・ロールバックする仕組みではないため、内容を確認し手動で対応してください。"
            echo "マイグレーション不整合が疑われる場合は \`docs/cloudflare-workers-builds.md\` の"
            echo "\"Operational Runbook: Repairing Migration History\" を参照してください。"
          } > "$BODY_FILE"

          EXISTING_NUMBER="$(gh issue list --repo "${{ github.repository }}" \
            --label production-incident --state open \
            --search "\"$TITLE\" in:title" \
            --json number --jq '.[0].number')"

          if [ -n "$EXISTING_NUMBER" ]; then
            echo "Existing incident issue #$EXISTING_NUMBER found; adding a comment"
            gh issue comment "$EXISTING_NUMBER" --repo "${{ github.repository }}" --body-file "$BODY_FILE"
          else
            echo "No existing open incident issue found; creating a new one"
            gh issue create --repo "${{ github.repository }}" \
              --title "$TITLE" \
              --body-file "$BODY_FILE" \
              --label "bug,production-incident"
          fi

      # Issue 作成後もジョブ自体は失敗として表示させ、Actions タブからも一目で分かるようにする
      - name: Fail the job if the smoke check failed
        if: steps.smoke.outcome == 'failure'
        run: exit 1
