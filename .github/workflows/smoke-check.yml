# Post-deploy Smoke Check (#536)
# デプロイ後スモークテスト
#
# Cloudflare Workers Builds and the provider-neutral migration workflow are
# independent push-triggered systems. This scheduled check detects a deployed
# application/schema mismatch within 15 minutes and files or updates an incident
# issue. It is an alert mechanism, not an automatic rollback gate.
#
# Required production Environment secret:
#   PLANETSCALE_DATABASE_URL: migration/read-capable connection string for the
#   authoritative production logical database.

name: Smoke Check

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      base_url:
        description: "チェック対象のベースURL (空欄なら本番URLを使用)"
        required: false
        default: ""

concurrency:
  group: smoke-check
  cancel-in-progress: false

jobs:
  smoke-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run smoke check
        id: smoke
        continue-on-error: true
        run: npm run smoke-check 2>&1 | tee smoke-check-output.log
        env:
          SMOKE_TEST_BASE_URL: ${{ github.event.inputs.base_url }}
          PLANETSCALE_DATABASE_URL: ${{ secrets.PLANETSCALE_DATABASE_URL }}

      - name: File or update incident issue on failure
        if: steps.smoke.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TITLE="[smoke-check] 本番スモークテストが失敗しています"
          BODY_FILE="$(mktemp)"
          {
            echo "## 自動検知: 本番スモークテスト失敗 (#536)"
            echo ""
            echo "- Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- Detected at: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo ""
            echo '```'
            cat smoke-check-output.log
            echo '```'
            echo ""
            echo "このIssueは \`.github/workflows/smoke-check.yml\` (#536) により自動生成/更新されました。"
            echo "デプロイを自動でブロック・ロールバックする仕組みではないため、内容を確認し手動で対応してください。"
            echo "マイグレーション不整合が疑われる場合は provider-neutral migration runner と"
            echo "PlanetScale production database の状態を確認してください。"
          } > "$BODY_FILE"

          EXISTING_NUMBER="$(gh issue list --repo "${{ github.repository }}" \
            --label production-incident --state open \
            --search "\"$TITLE\" in:title" \
            --json number --jq '.[0].number')"

          if [ -n "$EXISTING_NUMBER" ]; then
            echo "Existing incident issue #$EXISTING_NUMBER found; adding a comment"
            gh issue comment "$EXISTING_NUMBER" --repo "${{ github.repository }}" --body-file "$BODY_FILE"
          else
            echo "No existing open incident issue found; creating a new one"
            gh issue create --repo "${{ github.repository }}" \
              --title "$TITLE" \
              --body-file "$BODY_FILE" \
              --label "bug,production-incident"
          fi

      - name: Fail the job if the smoke check failed
        if: steps.smoke.outcome == 'failure'
        run: exit 1
