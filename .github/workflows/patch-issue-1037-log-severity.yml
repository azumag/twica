name: One-off patch issue 1037 chat log severity

on:
  push:
    branches:
      - chore/1037-chat-log-severity

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/1037-chat-log-severity

      - name: Align retry and reauth log severity
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/lib/services/eventsub-redemption.ts')
          text = path.read_text(encoding='utf-8')
          replacements = {
              "          logger.info('[postRedemptionNotify] chat announcement moved to DLQ pending Twitch reauthorization', {":
              "          logger.warn('[postRedemptionNotify] chat announcement moved to DLQ pending Twitch reauthorization', {",
              "        // 下のthrow/reportErrorへ回し、pendingはwarnログに留めて正常終了する。":
              "        // 下のthrow/reportErrorへ回す。pendingは自動回復中の正常状態なのでinfoに留める。",
              "        logger.warn('[postRedemptionNotify] chat announcement retry scheduled', {":
              "        logger.info('[postRedemptionNotify] chat announcement retry scheduled', {",
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'expected one match, got {text.count(old)}: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit patch and remove one-off workflow
        run: |
          rm .github/workflows/patch-issue-1037-log-severity.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/services/eventsub-redemption.ts .github/workflows/patch-issue-1037-log-severity.yml
          git commit -m "chore(chat): retryと再認証待ちのログ重大度を揃える" -m "Refs #1037"
          git push origin HEAD:chore/1037-chat-log-severity
