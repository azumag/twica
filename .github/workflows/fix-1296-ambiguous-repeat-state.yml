name: Fix Issue 1296 ambiguous commit repeat state

on:
  push:
    branches:
      - fix/1296-anti-repeat-gacha
    paths:
      - .github/workflows/fix-1296-ambiguous-repeat-state.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/1296-anti-repeat-gacha
          fetch-depth: 0

      - name: Resync repeat predecessor after ambiguous commit recovery
        run: |
          python -c 'from pathlib import Path; p=Path("src/lib/services/gacha.ts"); t=p.read_text(); old="            index = completedDrawCount - 1\n            continue"; new="            // 初回COMMIT成功・応答消失では、メモリ上のpreviousCardIdだけが\n            // COMMIT済み履歴より1枚古い。次drawの反復抑制もDB正本へ再同期する。\n            previousCardId = await this.getLatestCardIdForStreamer(streamerId)\n            index = completedDrawCount - 1\n            continue"; assert t.count(old) == 1, t.count(old); p.write_text(t.replace(old, new, 1))'

      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/fix-1296-ambiguous-repeat-state.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/services/gacha.ts .github/workflows/fix-1296-ambiguous-repeat-state.yml
          git commit -m "fix(gacha): ambiguous commit後の直前カードを再同期" -m "Refs #1296"
          git push origin HEAD:fix/1296-anti-repeat-gacha
