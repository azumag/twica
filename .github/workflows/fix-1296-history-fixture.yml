name: Fix Issue 1296 history fixture

on:
  push:
    branches:
      - fix/1296-anti-repeat-gacha
    paths:
      - .github/workflows/fix-1296-history-fixture.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/1296-anti-repeat-gacha
          fetch-depth: 0

      - name: Update the existing expectation
        run: |
          sed -i "s/単発メイン報酬では直近カード履歴を1回だけ確認する/単発メイン報酬でも直近カード履歴を確認する/" tests/unit/gacha-service.test.ts
          sed -i "s/expect(fixture.tableCursors.get('gacha_history')).toBe(1)/expect(fixture.tableCursors.has('gacha_history')).toBe(true)/" tests/unit/gacha-service.test.ts

      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/fix-1296-history-fixture.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/unit/gacha-service.test.ts .github/workflows/fix-1296-history-fixture.yml
          git commit -m "test(gacha): 直近履歴参照を既存fixtureへ反映" -m "Refs #1296"
          git push origin HEAD:fix/1296-anti-repeat-gacha
