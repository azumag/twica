name: One-off fix PR 1307
on:
  push:
    branches: ["fix/1002-overlay-queue-recovery"]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/1002-overlay-queue-recovery
          fetch-depth: 0
      - name: Patch queue recovery
        shell: bash
        run: |
          python -c "from pathlib import Path; import base64; p=Path('src/app/overlay/[streamerId]/page.tsx'); t=p.read_text(); s=t.index('    const scheduleQueueRecovery = (preserveCurrentCard: boolean) => {'); e=t.index('\\n    const handleQueueError = (error: unknown) => {', s); r=base64.b64decode('').decode(); p.write_text(t[:s]+r+t[e:])"
      - name: Commit fix and remove helper workflow
        shell: bash
        run: |
          rm .github/workflows/automation-fix-1307.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(overlay): make queue recovery timers fail-safe'
          git push origin HEAD:fix/1002-overlay-queue-recovery
