name: Patch PR 1309 retry state test

on:
  push:
    branches:
      - chore/1037-chat-log-severity

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/1037-chat-log-severity

      - name: Align dedicated retry-state log assertions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/unit/post-redemption-notify-chat-retry.test.ts')
          text = path.read_text(encoding='utf-8')
          replacements = {
            " * - 'pending'（自動再試行予定）: reportErrorを呼ばずwarnログのみ":
            " * - 'pending'（自動再試行予定）: reportErrorを呼ばずinfoログのみ",
            "const mockLoggerWarn = vi.mocked(logger.warn)":
            "const mockLoggerWarn = vi.mocked(logger.warn)\nconst mockLoggerInfo = vi.mocked(logger.info)",
            "it('pending（自動再試行予定）の場合はreportErrorを呼ばずwarnログのみ残す'":
            "it('pending（自動再試行予定）の場合はreportErrorを呼ばずinfoログのみ残す'",
            "    expect(mockLoggerWarn).toHaveBeenCalledWith(\n      '[postRedemptionNotify] chat announcement retry scheduled',":
            "    expect(mockLoggerInfo).toHaveBeenCalledWith(\n      '[postRedemptionNotify] chat announcement retry scheduled',",
            "    // のような反転ミス)を検知するため、pending専用のwarnログが出ないことも固定する。":
            "    // のような反転ミス)を検知するため、pending専用のinfoログが出ないことも固定する。",
            "    expect(mockLoggerWarn).not.toHaveBeenCalledWith(\n      '[postRedemptionNotify] chat announcement retry scheduled',":
            "    expect(mockLoggerInfo).not.toHaveBeenCalledWith(\n      '[postRedemptionNotify] chat announcement retry scheduled',",
          }
          for old, new in replacements.items():
              count = text.count(old)
              if old.startswith('    expect(mockLoggerWarn).not'):
                  if count != 2:
                      raise SystemExit(f'expected two negative warn assertions, got {count}')
                  text = text.replace(old, new)
              else:
                  if count != 1:
                      raise SystemExit(f'expected one match, got {count}: {old[:70]}')
                  text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit test and remove one-off workflow
        run: |
          rm .github/workflows/patch-pr1309-retry-state-test.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/unit/post-redemption-notify-chat-retry.test.ts .github/workflows/patch-pr1309-retry-state-test.yml
          git commit -m "test(chat): retryStateログ重大度をinfoへ同期" -m "Refs #1037 #1309"
          git push origin HEAD:chore/1037-chat-log-severity
