name: Release PR template contract

on:
  push:
    branches: [main, preview]
  pull_request:
    branches: [main, preview]

# #1371: Keep this as a dedicated workflow so template/QA-only changes still
# exercise the release contract; the job-level path filter skips its cost for unrelated changes.
jobs:
  changes:
    name: Detect release contract changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      contract: ${{ steps.filter.outputs.contract }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          base: ${{ github.ref }}
          # Keep the contract test itself in this dedicated filter even though broad CI also
          # runs it: test-only edits should still produce the stable release-contract check.
          filters: |
            contract:
              - '.github/PULL_REQUEST_TEMPLATE/**'
              - 'docs/QA.md'
              - 'tests/unit/release-pr-template-contract.test.ts'
              - '.github/workflows/notify-discord-main-merge.yml'
              - '.github/workflows/release-template-contract.yml'

  contract:
    needs: changes
    if: >-
      !cancelled() &&
      (needs.changes.result != 'success' ||
       needs.changes.outputs.contract == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Verify release PR template contract
        run: npx vitest run tests/unit/release-pr-template-contract.test.ts
