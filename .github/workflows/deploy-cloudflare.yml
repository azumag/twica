# Cloudflare Workers Deployment Workflow
# Cloudflare Workersデプロイメントワークフロー
#
# Database migrations are applied to the authoritative PlanetScale PostgreSQL
# database through the provider-neutral runner (`scripts/db-migrate.js`). The
# deploy pipeline therefore remains usable after the Supabase project, REST
# endpoint, secrets, and CLI integration are removed.
#
# - preview branch -> twica-preview Worker / preview logical database
# - main branch    -> twica Worker / production logical database

name: Cloudflare Deploy Support

on:
  push:
    branches: [main, preview]

  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "preview"
        type: choice
        options:
          - preview
          - production

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database-migrations:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.environment) || (github.ref == 'refs/heads/preview' && 'preview') || 'production' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Apply PlanetScale migrations
        run: |
          if [ "$RESOLVED_ENV" = "production" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Production migrations are only allowed from the main branch"
            exit 1
          fi
          npm run db:migrate:apply -- --provider=planetscale
          npm run db:migrate:verify -- --provider=planetscale
        env:
          # Configure this secret independently in the preview/production
          # GitHub Environments. It must use the corresponding PlanetScale
          # logical database and a migration-capable role.
          DATABASE_URL: ${{ secrets.PLANETSCALE_DATABASE_URL }}
          RESOLVED_ENV: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.environment) || (github.ref == 'refs/heads/preview' && 'preview') || 'production' }}

  legacy-app-deploy:
    if: vars.CLOUDFLARE_WORKERS_BUILDS_ENABLED != 'true'
    needs: database-migrations
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    environment: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.environment) || (github.ref == 'refs/heads/preview' && 'preview') || 'production' }}

    steps:
      - name: Determine deploy command
        id: env
        run: |
          if [ "${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.environment) || (github.ref == 'refs/heads/preview' && 'preview') || 'production' }}" = "preview" ]; then
            echo "deploy_cmd=npm run workers:deploy:preview" >> $GITHUB_OUTPUT
          else
            echo "deploy_cmd=npm run workers:deploy" >> $GITHUB_OUTPUT
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run workers:build
        env:
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_TWITCH_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_TWITCH_CLIENT_ID }}
          NEXT_PUBLIC_CF_IMAGES_ENABLED: ${{ secrets.NEXT_PUBLIC_CF_IMAGES_ENABLED }}

      - name: Deploy
        run: ${{ steps.env.outputs.deploy_cmd }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Error Reporter Cron Worker
        if: steps.env.outputs.deploy_cmd != 'npm run workers:deploy:preview'
        working-directory: workers/error-reporter
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  auxiliary-workers:
    if: vars.CLOUDFLARE_WORKERS_BUILDS_ENABLED == 'true' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production'))
    needs: database-migrations
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Deploy Error Reporter Cron Worker
        working-directory: workers/error-reporter
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
