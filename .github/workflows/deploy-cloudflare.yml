# Cloudflare Workers Deployment Workflow
# Cloudflare Workersデプロイメントワークフロー
#
# GitHub Actions always applies Supabase migrations from the existing GitHub
# Environment secrets. Legacy app deploys run here until Cloudflare Workers
# Builds is enabled. After setting the repository variable
# CLOUDFLARE_WORKERS_BUILDS_ENABLED=true, app deploys are handled by Cloudflare
# and this workflow keeps migrations plus the auxiliary error-reporter Worker.
#
# Cloudflare Workers Builds に切り替えるまでは、OpenNext（@opennextjs/cloudflare）
# を使用して Next.js アプリを GitHub Actions からデプロイする。
# リポジトリ変数 CLOUDFLARE_WORKERS_BUILDS_ENABLED=true を設定した後は、
# アプリ本体のデプロイは Cloudflare 側で行い、この workflow はマイグレーションと
# 補助 Worker を扱う。
#
# Supabase migrations are applied automatically via `supabase db push --db-url`
# before the build step. Each GitHub Environment holds its own SUPABASE_DB_URL.
# Supabase マイグレーションは `supabase db push --db-url` でビルド前に自動適用される。
# 各 GitHub Environment に SUPABASE_DB_URL を設定すること。
#
# Production の実DBは issue #699 で PlanetScale (Postgres互換) へ cutover 済みのため、
# `supabase db push` は rollback用に温存している旧Supabase本番へのみ適用される。実際に
# アプリが読み書きする本番PlanetScaleへは、下記 `planetscale-migrations` ジョブが
# `scripts/db-migrate.js apply --provider=planetscale` を自動実行する
# （production・main ブランチのみ。preview はまだ PlanetScale 未cutoverのため対象外）。
# 初回有効化前に一度だけ手動での bootstrap 登録が必要。詳細・手順は
# `docs/planetscale-schema-baseline.md` の「issue #788・CI自動化に伴う追記」節を参照。
#
# Production's live DB was cut over from Supabase to PlanetScale (Postgres-compatible)
# in issue #699, so `supabase db push` now only reaches the retained (rollback-only)
# legacy Supabase production DB. The `planetscale-migrations` job below applies
# `scripts/db-migrate.js apply --provider=planetscale` against the actual production
# DB on every push to main (preview is not yet cut over, so it's excluded). A one-time
# manual bootstrap registration is required before first use — see
# `docs/planetscale-schema-baseline.md`.
#
# - preview branch → twica-preview Worker (preview environment)
# - main branch    → twica Worker (production environment)
#
# Prerequisites / 前提条件:
#
# 1. GitHub repository secrets (shared across environments):
#    リポジトリレベルの Secrets（全環境共通）:
#    - CLOUDFLARE_API_TOKEN: API token with Workers edit permissions
#    - CLOUDFLARE_ACCOUNT_ID: Your Cloudflare account ID
#
# 2. GitHub Environments: Create "preview" and "production" environments
#    in Settings → Environments, each with the following secrets:
#    GitHub Environments: Settings → Environments で "preview" と "production" を作成し、
#    それぞれに以下の Secrets を設定:
#    - SUPABASE_DB_URL               (Session pooler URI, port 5432)
#    - NEXT_PUBLIC_APP_URL          (e.g. preview: https://twica-preview.xxx.workers.dev)
#    - NEXT_PUBLIC_SUPABASE_URL
#    - NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
#    - NEXT_PUBLIC_TWITCH_CLIENT_ID
#
# 3. "production" environment only, additionally:
#    "production" environment のみ、追加で以下の Secret を設定:
#    - PLANETSCALE_DATABASE_URL: PlanetScale本番Postgresへの直接接続文字列
#      (migration専用。Hyperdrive経由のアプリ実行時接続とは別物。
#      db/planetscale/bootstrap.sql 等の手動適用と同じ接続文字列を使うこと)

name: Cloudflare Deploy Support

on:
  push:
    # branches: [preview]
    # Uncomment to also auto-deploy production on push to main
    # mainへのプッシュ時にも本番自動デプロイするにはコメント解除
    branches: [main, preview]

  # Manual trigger allows deploying any branch to either environment
  # 手動トリガーで任意のブランチをどちらの環境にもデプロイ可能
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "preview"
        type: choice
        options:
          - preview
          - production

# Prevent concurrent deployments to the same environment
# 同一環境への同時デプロイを防止
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  supabase-migrations:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    # GitHub Environment を動的に選択することで、環境ごとの Secrets が自動的に解決される。
    # workflow_dispatch の場合は手動選択、push の場合はブランチ名で判定。
    # Dynamically select the GitHub Environment so that per-environment
    # Secrets are resolved automatically. workflow_dispatch uses the manual
    # selection; push events are determined by branch name.
    environment: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.environment) || (github.ref == 'refs/heads/preview' && 'preview') || 'production' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Supabase CLI をセットアップし、マイグレーションを適用する。
      # Node.js / npm ci より前に配置し、マイグレーション失敗時に
      # 不要な依存インストールを回避する。
      # --db-url 方式により supabase link 不要・シークレット1つで動作する。
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.76.14

      # production 環境へのマイグレーションは main ブランチからのみ許可。
      # workflow_dispatch で非 main ブランチから production を選択した場合を防止する。
      - name: Apply Supabase migrations
        run: |
          if [ "$RESOLVED_ENV" = "production" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Production migrations are only allowed from the main branch"
            exit 1
          fi
          supabase db push --db-url "$SUPABASE_DB_URL" --yes
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          RESOLVED_ENV: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.environment) || (github.ref == 'refs/heads/preview' && 'preview') || 'production' }}

  # 本番の実DB（PlanetScale、issue #699でcutover済み）へ scripts/db-migrate.js で
  # migrationを自動適用する。production・main ブランチのみが対象（preview はまだ
  # PlanetScale 未cutoverのため対象外。cutoverしたら preview 向けの同種ジョブを追加する）。
  #
  # legacy-app-deploy / auxiliary-workers からは意図的に needs で依存させない
  # （このジョブが失敗してもブロックしない独立ジョブとする）。理由:
  # - CLOUDFLARE_WORKERS_BUILDS_ENABLED=true の場合、実アプリデプロイは Cloudflare の
  #   Git連携がこの workflow と無関係に進む。ここでブロックしても実効性が薄い。
  # - アプリ側は列欠落（migration未適用）を検知してもクラッシュせず機能を無効化した
  #   状態へ縮退する設計（deploy-window fallback、issue #788）を前提にしている。
  # 失敗時の可視化は通常のコミットステータスチェック（および対象PR/コミットの
  # デフォルトのGitHub通知）に委ねる。required check化やSlack通知等の追加アラートは
  # 現時点ではYAGNIと判断し導入していない（必要になれば別途追加する）。
  #
  # 初回有効化前に一度だけ、既存migrationを「実行せず履歴登録のみ」する手動bootstrapが
  # 必要（docs/planetscale-schema-baseline.md 参照）。未実施のままだと、history table
  # 不在 + pending件数過多で db-migrate.js 自身の安全ガード（shouldBlockFreshApply）が
  # 働き、データ破壊なく exit 1 する（＝赤くなり続けるだけで、74件が誤実行されることはない）。
  planetscale-migrations:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment: production
    # workflow全体のconcurrencyグループ（cancel-in-progress: true）に巻き込まれると、
    # main連続pushで実行中の本番migrationジョブごとキャンセルされうる（claude-reviewの
    # 指摘）。job単位のconcurrencyを別グループで指定するとworkflowレベルの設定を
    # このジョブに限り上書きできる。cancel-in-progress: false により、後続runは
    # 先行のmigrationジョブが完走するまでキューで待つ（キャンセルしない）。
    # required(トランザクション内)なmigrationはキャンセルされてもコネクション切断で
    # 自動rollbackされ安全だが、将来 forbidden(CREATE INDEX CONCURRENTLY等、
    # トランザクション外実行が必須)なmigrationが追加された場合、中断は
    # INVALIDなオブジェクトの残留・手動復旧を要する半端な状態を招きうるため。
    concurrency:
      group: planetscale-migrate-${{ github.ref }}
      cancel-in-progress: false
    # pg_advisory_lock（scripts/db-migrate.js）はロック取得までブロックする。
    # 手動bootstrap作業との時間的重複等でロックが解放されない場合に備え、
    # GitHub Actionsのデフォルトタイムアウト(6時間)に張り付き続けないよう上限を設ける
    # （claude-reviewの指摘）。通常のDDL適用は数秒〜数分で完了する想定のため、
    # 10分は十分に余裕を持たせた値。
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # ジョブ自体は if: で production (main push または workflow_dispatch の
      # environment=production 選択) にのみ限定しているが、Supabase migrations の
      # 既存ステップと同様、workflow_dispatch 経路で非 main ブランチから production を
      # 選択した場合に備えた実行時ガードも二重に入れる（if: 条件の書き間違い・将来の
      # 変更に対する多層防御。本番DBへのmigration適用はerror-reporter再デプロイ等より
      # 破壊的なため、単一の防御層に頼らない）。
      - name: Apply PlanetScale migrations
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::PlanetScale production migrations are only allowed from the main branch"
            exit 1
          fi
          node scripts/db-migrate.js apply --provider=planetscale
        env:
          DATABASE_URL: ${{ secrets.PLANETSCALE_DATABASE_URL }}
          MIGRATION_APPLIED_BY: github-actions[${{ github.run_id }}]

  legacy-app-deploy:
    if: vars.CLOUDFLARE_WORKERS_BUILDS_ENABLED != 'true'
    needs: supabase-migrations
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    # GitHub Environment を動的に選択することで、環境ごとの Secrets が自動的に解決される。
    # workflow_dispatch の場合は手動選択、push の場合はブランチ名で判定。
    # Dynamically select the GitHub Environment so that per-environment
    # Secrets are resolved automatically. workflow_dispatch uses the manual
    # selection; push events are determined by branch name.
    environment: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.environment) || (github.ref == 'refs/heads/preview' && 'preview') || 'production' }}

    steps:
      # デプロイコマンドを環境に応じて決定する。
      # preview → `workers:deploy:preview`、production → `workers:deploy`。
      # Determine the deploy command based on the resolved environment.
      # preview → `workers:deploy:preview`, production → `workers:deploy`.
      - name: Determine deploy command
        id: env
        run: |
          if [ "${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.environment) || (github.ref == 'refs/heads/preview' && 'preview') || 'production' }}" = "preview" ]; then
            echo "deploy_cmd=npm run workers:deploy:preview" >> $GITHUB_OUTPUT
          else
            echo "deploy_cmd=npm run workers:deploy" >> $GITHUB_OUTPUT
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # NEXT_PUBLIC_* 変数はビルド時にクライアントJSにインライン化されるため、
      # ここで設定する必要がある。各値は GitHub Environment の Secrets から取得され、
      # preview / production で異なる値が自動的に使われる。
      # サーバー側のシークレットは Cloudflare Worker Secrets として
      # wrangler / ダッシュボード経由で設定済みのため、ビルド時には不要。
      #
      # NEXT_PUBLIC_* variables are inlined into client JS at build time,
      # so they must be set here. Values are pulled from the GitHub Environment
      # Secrets, automatically resolving to the correct per-environment values.
      # Server-side secrets are configured as Cloudflare Worker Secrets
      # via wrangler / dashboard and are NOT needed at build time.
      - name: Build
        run: npm run workers:build
        env:
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_TWITCH_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_TWITCH_CLIENT_ID }}
          NEXT_PUBLIC_CF_IMAGES_ENABLED: ${{ secrets.NEXT_PUBLIC_CF_IMAGES_ENABLED }}

      # Wrangler は CLOUDFLARE_API_TOKEN 環境変数で認証する。
      # Wrangler authenticates via CLOUDFLARE_API_TOKEN env var.
      - name: Deploy
        run: ${{ steps.env.outputs.deploy_cmd }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Error Reporter Cron Worker のデプロイ（本番のみ）
      # Supabase errors テーブルの未処理エラーを定期的に GitHub Issue 化する。
      # Secrets (SUPABASE_URL, SUPABASE_SECRET_KEY, GITHUB_TOKEN) は
      # Cloudflare Dashboard で事前設定が必要。
      # See: https://github.com/azumag/twica/issues/239
      - name: Deploy Error Reporter Cron Worker
        if: steps.env.outputs.deploy_cmd != 'npm run workers:deploy:preview'
        working-directory: workers/error-reporter
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  auxiliary-workers:
    if: vars.CLOUDFLARE_WORKERS_BUILDS_ENABLED == 'true' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production'))
    needs: supabase-migrations
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Error Reporter Cron Worker のデプロイ（本番のみ）
      # Supabase errors テーブルの未処理エラーを定期的に GitHub Issue 化する。
      # Secrets (SUPABASE_URL, SUPABASE_SECRET_KEY, GITHUB_TOKEN) は
      # Cloudflare Dashboard で事前設定が必要。
      # See: https://github.com/azumag/twica/issues/239
      - name: Deploy Error Reporter Cron Worker
        working-directory: workers/error-reporter
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
