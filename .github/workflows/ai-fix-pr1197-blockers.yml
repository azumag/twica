'''
          assert text.count(old) == 1, 'gacha_result queue source changed'
          text = text.replace(old, new)
          realtime.write_text(text)
      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/ai-fix-pr1197-blockers.yml
          git add src/app/overlay/'[streamerId]'/page.tsx src/lib/realtime.ts .github/workflows/ai-fix-pr1197-blockers.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(overlay): address blocking review feedback'
          git push origin HEAD:codex/issue-1076-overlay-black-fix
