name: Patch PR 1307 pre-display recovery

on:
  push:
    branches:
      - fix/1002-overlay-queue-recovery

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/1002-overlay-queue-recovery

      - name: Keep pre-display recovery to one macro task
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/app/overlay/[streamerId]/page.tsx')
          text = path.read_text(encoding='utf-8')
          start_marker = '    const scheduleQueueRecovery = (preserveCurrentCard: boolean) => {'
          end_marker = '    const handleQueueError = (error: unknown) => {'
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          replacement = '''    const scheduleQueueRecovery = (preserveCurrentCard: boolean) => {
            if (recoveryScheduled) return;
            recoveryScheduled = true;
            const expectedQueueGeneration = queueGeneration;
            const hideDelayMs = preserveCurrentCard ? options.displayDuration * 1000 : 0;

            // Keep recovery timers local. Cleanup increments queueGeneration, so stale
            // callbacks become no-ops without overwriting animationTimeoutRef. Failures
            // before display starts advance in this single macro task; only a card that
            // was actually visible keeps the normal 500ms inter-card gap.
            setTimeout(() => {
              if (
                !isOverlayMountedRef.current
                || expectedQueueGeneration !== queueGenerationRef.current
              ) {
                return;
              }

              if (!displayStarted) {
                imageLayoutGenerationRef.current += 1;
                activeDisplayInstanceIdRef.current = undefined;
                setResult(null);
                setImageFallbackDisplayInstanceId(null);
                processQueueRef.current();
                return;
              }

              setShowCard(false);
              setActiveEffectStyle("none");
              setEffectParticles([]);
              setTimeout(() => {
                if (
                  !isOverlayMountedRef.current
                  || expectedQueueGeneration !== queueGenerationRef.current
                ) {
                  return;
                }
                imageLayoutGenerationRef.current += 1;
                activeDisplayInstanceIdRef.current = undefined;
                setResult(null);
                setImageFallbackDisplayInstanceId(null);
                processQueueRef.current();
              }, 500);
            }, hideDelayMs);
          };

          '''
          # Remove indentation inherited from the YAML block while keeping TS indentation.
          replacement = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in replacement.splitlines()
          ) + '\n'
          text = text[:start] + replacement + text[end:]
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit patch and remove one-off workflow
        run: |
          rm .github/workflows/patch-pr1307-pre-display-recovery.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/overlay/[streamerId]/page.tsx .github/workflows/patch-pr1307-pre-display-recovery.yml
          git commit -m "fix(overlay): 表示前例外は1タスクでqueueを継続する" -m "Refs #1002 #1307"
          git push origin HEAD:fix/1002-overlay-queue-recovery
