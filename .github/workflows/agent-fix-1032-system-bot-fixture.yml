name: Agent one-shot PR 1032 fixture fix

on:
  push:
    branches:
      - fix/redemption-ranking-streamer-bot-exclusion
    paths:
      - .github/workflows/agent-fix-1032-system-bot-fixture.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/redemption-ranking-streamer-bot-exclusion
          fetch-depth: 0
      - name: Fix system BOT fixture assertions
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/fixtures/redemption-ranking-exclusions-postgres.sql')
          text = path.read_text()
          old = """  IF NOT FOUND OR v_s1.total_points <> 400 THEN
    RAISE EXCEPTION '共有system BOT解除後、配信者1側が復帰していない: %', row_to_json(v_s1);
  END IF;
  IF v_s2.total_points IS DISTINCT FROM 500 THEN
    RAISE EXCEPTION '共有system BOT解除後、配信者2側が復帰していない(全配信者展開の回帰): %', row_to_json(v_s2);
  END IF;
"""
          new = """  -- FOUND は直前の SELECT INTO(v_s2)だけを表すため、v_s1 の存在確認には
  -- 使えない。IS DISTINCT FROM なら NULL(行なし)も確実に失敗として検知できる。
  -- pointsだけでなくcountも固定し、system BOT解除で全配信者ぶん正しく再集計
  -- されることを直接検証する。
  IF v_s1.total_points IS DISTINCT FROM 400 OR v_s1.redemption_count IS DISTINCT FROM 1 THEN
    RAISE EXCEPTION '共有system BOT解除後、配信者1側が復帰していない: %', row_to_json(v_s1);
  END IF;
  IF v_s2.total_points IS DISTINCT FROM 500 OR v_s2.redemption_count IS DISTINCT FROM 1 THEN
    RAISE EXCEPTION '共有system BOT解除後、配信者2側が復帰していない(全配信者展開の回帰): %', row_to_json(v_s2);
  END IF;
"""
          if old not in text:
              raise SystemExit('target block not found; branch may already be fixed')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/fixtures/redemption-ranking-exclusions-postgres.sql
          git rm .github/workflows/agent-fix-1032-system-bot-fixture.yml
          git commit -m "test: fix system BOT restoration assertion"
          git pull --rebase origin fix/redemption-ranking-streamer-bot-exclusion
          git push origin HEAD:fix/redemption-ranking-streamer-bot-exclusion
