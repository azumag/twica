name: Notify Discord on main or preview merge

# Security contract: pull_request_target lets a merged PR notification read the
# repository webhook secret from the trusted base context. Any checkout in this
# workflow must stay pinned to github.sha (the trusted base commit); never checkout
# or execute code from the PR head. Keep permissions at `contents: read`; do not
# widen them without a reviewed workflow requirement.
#
# Scope: this workflow notifies for merges into `main` (release promotions and
# direct main merges) and for merges into `preview` (feature PRs). Only the
# canonical `preview -> main` promotion is governed by the release-summary
# contract; the `validate-promotion-summary` job below stays scoped to
# `main`-target PRs, while a preview merge is notified with the sanitized PR title
# (or the release section if the body carries one). The file name is kept
# unchanged only to avoid churn in the CI paths-filter and test references: the
# required status check context is the job name `validate-promotion-summary`, so
# that job name has to stay stable when repository rules are updated.
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review, closed]
    branches: [main, preview]

permissions:
  contents: read

jobs:
  validate-promotion-summary:
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'preview'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted base workflow helpers
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate promotion summary before merge
        shell: bash
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 .github/scripts/release_summary.py --validate
  notify:
    if: github.event.action == 'closed' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    env:
      # PR/repository-derived strings stay in env and are consumed as data by Python/jq;
      # do not interpolate them directly into the shell script.
      # GITHUB_REPOSITORY is a GitHub-provided default env and is the trusted base for fork checks.
      REPOSITORY_NAME: ${{ github.event.repository.name }}
      # BASE_REF comes from the trusted pull_request_target base context, not from
      # the PR head. It decides whether this is a production release notification
      # (`main`) or a pre-release preview notification (`preview`), and it is also
      # part of the promotion check, so the PR cannot influence it.
      BASE_REF: ${{ github.event.pull_request.base.ref }}
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_BODY: ${{ github.event.pull_request.body }}
      PR_URL: ${{ github.event.pull_request.html_url }}
      PR_AUTHOR: ${{ github.event.pull_request.user.login }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}

    steps:
      - name: Validate webhook configuration
        shell: bash
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [[ -z "$DISCORD_WEBHOOK_URL" ]]; then
            echo "::error::Repository secret DISCORD_WEBHOOK_URL is not configured."
            exit 1
          fi

      - name: Checkout trusted base workflow helpers
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Send merge notification to Discord
        shell: bash
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          # Promotion PRs keep the human-facing release summary in the first
          # `## このリリースで変わること` section. Reuse that text directly
          # instead of rediscovering component PRs through the GitHub API.
          # The promotion PR body is intentionally the notification source of truth:
          # this workflow does not reconstruct the summary from component diffs, so
          # summary-vs-diff accuracy remains a normal promotion-PR review responsibility.
          #
          # The same step also renders the notification for feature PRs merged into
          # `preview`. Those PRs normally have no promotion summary, so they are
          # notified with the sanitized PR title (the release section would still be
          # used if a preview PR body happened to carry one), and the wording/target
          # ref is chosen from the trusted base ref so a preview deploy is never
          # announced as a release.
          content=$(python3 - <<'PY'
          import os
          import sys

          sys.path.insert(0, ".github/scripts")
          import release_summary

          limit = 2000
          promotion_source_ref = "preview"
          promotion_target_ref = "main"
          # BASE_REF comes from the trusted pull_request_target base context, so it
          # cannot be influenced by the PR head. Only an explicit `main` match gets
          # the production wording below; any other value (a future branch, or a
          # missing env entry) stays in the preview wording so a misconfigured
          # trigger can never announce an unreleased deploy as shipped.
          base_ref = os.environ.get("BASE_REF", "")
          body = os.environ.get("PR_BODY", "")
          # Only same-repository text is trusted as notification input.
          # Fork PRs fall back to a sanitized title below.
          if os.environ.get("HEAD_REPOSITORY") != os.environ.get("GITHUB_REPOSITORY"):
              body = ""
          release_text = release_summary.extract_release_text(body)

          # Only the canonical `preview -> main` promotion is governed by the
          # release-summary contract. Both conditions must hold before this
          # workflow is allowed to warn about (or fail on) a missing summary.
          is_promotion = (
              base_ref == promotion_target_ref
              and os.environ.get("HEAD_REF") == promotion_source_ref
              and os.environ.get("HEAD_REPOSITORY") == os.environ.get("GITHUB_REPOSITORY")
          )

          def escape_discord_markdown(value):
              escaped = value
              for marker in ("\\", "`", "*", "_", "~", "|"):
                  escaped = escaped.replace(marker, "\\" + marker)
              return escaped

          def discord_inline_code(value):
              # Normal refs keep the compact code style. A rare ref containing a
              # backtick falls back to escaped plain text instead of breaking the span.
              if "`" in value:
                  return escape_discord_markdown(value)
              return f"`{value}`"

          if not release_summary.has_meaningful_text(release_text):
              if is_promotion:
                  print(
                      "::warning::Promotion PR summary missing after sanitization; "
                      "sending a title fallback and failing the job after delivery.",
                      file=sys.stderr,
                  )
                  release_text = release_summary.strip_markdown_links(
                      os.environ.get("PR_TITLE", "").strip()
                  ).strip()
                  if not release_summary.has_meaningful_text(release_text):
                      release_text = "リリース内容の説明が未記入です"
                  with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
                      env.write("PROMOTION_SUMMARY_MISSING=true" + chr(10))
              else:
                  # Preview merges and direct-to-main merges have no
                  # promotion-summary contract. Falling back to the sanitized PR
                  # title is the expected path for both, so do not emit a
                  # misleading warning or failure marker for these normal cases.
                  release_text = release_summary.strip_markdown_links(
                      os.environ.get("PR_TITLE", "").strip()
                  ).strip()

          repository_name = escape_discord_markdown(os.environ["REPOSITORY_NAME"])
          head_ref = discord_inline_code(os.environ["HEAD_REF"])
          pr_author = escape_discord_markdown(os.environ["PR_AUTHOR"])
          # A preview merge is a pre-release deploy, so both the wording and the
          # target ref have to be distinguishable at a glance from the production
          # release notification in the same Discord channel (see the BASE_REF note
          # above for why production wording requires an explicit `main` match).
          if base_ref == promotion_target_ref:
              prefix = f"🚀 **{repository_name} が更新されました**\n\n"
              suffix = (
                  f"\n\n{head_ref} → main\n"
                  f"by {pr_author}\n\n"
                  f"🔗 [リリース内容を見る]({os.environ['PR_URL']})"
              )
          else:
              prefix = f"🧪 **{repository_name} (preview) が更新されました**\n\n"
              suffix = (
                  f"\n\n{head_ref} → preview\n"
                  f"by {pr_author}\n\n"
                  f"🔗 [更新内容を見る]({os.environ['PR_URL']})"
              )

          # GitHub currently bounds repository/user/ref metadata far below Discord's
          # 2000 UTF-16-unit limit, but keep delivery fail-safe if those contracts or
          # event payloads ever change. In that pathological case, discard optional
          # metadata before trimming the user-facing release text.
          marker = "\n\n…"
          if release_summary.utf16_length(prefix + marker + suffix) > limit:
              # This branch is unreachable with GitHub's current metadata bounds and
              # exists only as a delivery fail-safe. The wording makes no target-ref
              # claim, so it is safe for preview merges as well (the rocket emoji is
              # decorative and does not assert a production release).
              prefix = "🚀 **リポジトリが更新されました**\n\n"
              suffix = f"\n\n🔗 {os.environ['PR_URL']}"

          content = prefix + release_text + suffix
          if release_summary.utf16_length(content) > limit:
              available = limit - release_summary.utf16_length(prefix + marker + suffix)
              release_text = release_summary.truncate_markdown_utf16(
                  release_text, max(0, available)
              )
              content = prefix + release_text + marker + suffix

          if release_summary.utf16_length(content) > limit:
              raise SystemExit("Discord notification exceeds 2000 characters after trimming")

          print(content, end="")
          PY
          )

          payload=$(jq -n \
            --arg content "$content" \
            '{
              username: "twica GitHub",
              content: $content,
              allowed_mentions: {parse: []}
            }')

          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --retry 3 \
            --retry-all-errors \
            --connect-timeout 10 \
            --max-time 30 \
            -H 'Content-Type: application/json' \
            -d "$payload" \
            "$DISCORD_WEBHOOK_URL"
      - name: Fail after notifying missing promotion summary
        if: success()
        shell: bash
        run: |
          if [[ "$PROMOTION_SUMMARY_MISSING" == "true" ]]; then
            echo "::error::Promotion PR summary was missing; notification was sent using the title fallback."
            exit 1
          fi
