name: Notify Discord on main merge

# Security contract: pull_request_target lets a merged PR notification read the
# repository webhook secret from the trusted base context. Any checkout in this
# workflow must stay pinned to github.sha (the trusted base commit); never checkout
# or execute code from the PR head. Keep permissions at `contents: read`; do not
# widen them without a reviewed workflow requirement.
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review, closed]
    branches: [main]

permissions:
  contents: read

jobs:
  validate-promotion-summary:
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'preview'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted base workflow helpers
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate promotion summary before merge
        shell: bash
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 .github/scripts/release_summary.py --validate
  notify:
    if: github.event.action == 'closed' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    env:
      # PR/repository-derived strings stay in env and are consumed as data by Python/jq;
      # do not interpolate them directly into the shell script.
      # GITHUB_REPOSITORY is a GitHub-provided default env and is the trusted base for fork checks.
      REPOSITORY_NAME: ${{ github.event.repository.name }}
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_BODY: ${{ github.event.pull_request.body }}
      PR_URL: ${{ github.event.pull_request.html_url }}
      PR_AUTHOR: ${{ github.event.pull_request.user.login }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}

    steps:
      - name: Validate webhook configuration
        shell: bash
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [[ -z "$DISCORD_WEBHOOK_URL" ]]; then
            echo "::error::Repository secret DISCORD_WEBHOOK_URL is not configured."
            exit 1
          fi

      - name: Checkout trusted base workflow helpers
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Send merge notification to Discord
        shell: bash
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          # Promotion PRs keep the human-facing release summary in the first
          # `## このリリースで変わること` section. Reuse that text directly
          # instead of rediscovering component PRs through the GitHub API.
          # The promotion PR body is intentionally the notification source of truth:
          # this workflow does not reconstruct the summary from component diffs, so
          # summary-vs-diff accuracy remains a normal promotion-PR review responsibility.
          content=$(python3 - <<'PY'
          import os
          import sys

          sys.path.insert(0, ".github/scripts")
          import release_summary

          limit = 2000
          # Only the canonical preview -> main path is a release promotion.
          # The workflow itself is already scoped to PRs targeting main, so only
          # the head ref and repository identity need to be checked here.
          promotion_source_ref = "preview"
          body = os.environ.get("PR_BODY", "")
          # Only same-repository promotion text is trusted as notification input.
          # Fork PRs fall back to a sanitized title below.
          if os.environ.get("HEAD_REPOSITORY") != os.environ.get("GITHUB_REPOSITORY"):
              body = ""
          release_text = release_summary.extract_release_text(body)

          def escape_discord_markdown(value):
              escaped = value
              for marker in ("\\", "`", "*", "_", "~", "|"):
                  escaped = escaped.replace(marker, "\\" + marker)
              return escaped

          def discord_inline_code(value):
              # Normal refs keep the compact code style. A rare ref containing a
              # backtick falls back to escaped plain text instead of breaking the span.
              if "`" in value:
                  return escape_discord_markdown(value)
              return f"`{value}`"

          if not release_summary.has_meaningful_text(release_text):
              is_promotion = (
                  os.environ.get("HEAD_REF") == promotion_source_ref
                  and os.environ.get("HEAD_REPOSITORY") == os.environ.get("GITHUB_REPOSITORY")
              )
              if is_promotion:
                  print(
                      "::warning::Promotion PR summary missing after sanitization; "
                      "sending a title fallback and failing the job after delivery.",
                      file=sys.stderr,
                  )
                  release_text = release_summary.strip_markdown_links(
                      os.environ.get("PR_TITLE", "").strip()
                  ).strip()
                  if not release_summary.has_meaningful_text(release_text):
                      release_text = "リリース内容の説明が未記入です"
                  with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
                      env.write("PROMOTION_SUMMARY_MISSING=true" + chr(10))
              else:
                  # A direct-to-main merge has no promotion-summary contract.
                  # Falling back to the sanitized PR title is the expected path,
                  # so do not emit a misleading warning for this normal case.
                  release_text = release_summary.strip_markdown_links(
                      os.environ.get("PR_TITLE", "").strip()
                  ).strip()

          repository_name = escape_discord_markdown(os.environ["REPOSITORY_NAME"])
          head_ref = discord_inline_code(os.environ["HEAD_REF"])
          pr_author = escape_discord_markdown(os.environ["PR_AUTHOR"])
          prefix = f"🚀 **{repository_name} が更新されました**\n\n"
          suffix = (
              f"\n\n{head_ref} → main\n"
              f"by {pr_author}\n\n"
              f"🔗 [リリース内容を見る]({os.environ['PR_URL']})"
          )

          def discord_length(value):
              return len(value.encode("utf-16-le")) // 2

          def truncate_utf16(value, max_units):
              result = []
              used = 0
              for char in value:
                  units = len(char.encode("utf-16-le")) // 2
                  if used + units > max_units:
                      break
                  result.append(char)
                  used += units
              return "".join(result)

          # GitHub currently bounds repository/user/ref metadata far below Discord's
          # 2000 UTF-16-unit limit, but keep delivery fail-safe if those contracts or
          # event payloads ever change. In that pathological case, discard optional
          # metadata before trimming the user-facing release text.
          marker = "\n\n…"
          if discord_length(prefix + marker + suffix) > limit:
              prefix = "🚀 **リポジトリが更新されました**\n\n"
              suffix = f"\n\n🔗 {os.environ['PR_URL']}"

          content = prefix + release_text + suffix
          if discord_length(content) > limit:
              available = limit - discord_length(prefix + marker + suffix)
              release_text = truncate_utf16(release_text, max(0, available)).rstrip()
              content = prefix + release_text + marker + suffix

          if discord_length(content) > limit:
              raise SystemExit("Discord notification exceeds 2000 characters after trimming")

          print(content, end="")
          PY
          )

          payload=$(jq -n \
            --arg content "$content" \
            '{
              username: "twica GitHub",
              content: $content,
              allowed_mentions: {parse: []}
            }')

          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --retry 3 \
            --retry-all-errors \
            --connect-timeout 10 \
            --max-time 30 \
            -H 'Content-Type: application/json' \
            -d "$payload" \
            "$DISCORD_WEBHOOK_URL"
      - name: Fail after notifying missing promotion summary
        if: success()
        shell: bash
        run: |
          if [[ "$PROMOTION_SUMMARY_MISSING" == "true" ]]; then
            echo "::error::Promotion PR summary was missing; notification was sent using the title fallback."
            exit 1
          fi
