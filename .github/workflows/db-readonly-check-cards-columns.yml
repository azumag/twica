# 読み取り専用の観測 workflow (Issue #954 のフォールバック要否判断の実測用)
#
# 目的:
#   PlanetScale の **preview** 論理DBに対して **SELECT のみ** を実行し、cards テーブルの
#   対象4列（card_number / max_issuance_count / collection_name / image_padding_color）の
#   実在を information_schema.columns 経由で出力する。Issue #954 は「残存デプロイ窓
#   フォールバック（card_number系・image_padding_color）の撤去可否」を本番実測で判断する
#   issue であり、#834（PR #953）が cards バトル8列の撤去前に information_schema 実測を
#   必須前提としたのと同じ手順を踏む。測定列は issue で固定された4列のみで、SQL の
#   差し替え input は作らない（既存 db-readonly-check*.yml と同じ安全設計）。
#
#   カード列の存在確認のみを目的とするため、行データ・payload は一切読まない
#   （information_schema のメタデータだけを出力する。視聴者情報は含まれない）。
#
# 安全設計（.github/workflows/db-readonly-check.yml と同じ構え）:
#   - トリガは workflow_dispatch のみ。push / schedule / pull_request では動かない。
#   - **対象 Environment を preview に固定**する。読み取り専用の観測は preview だけを対象とし、
#     production の secret へ到達する経路を最初から作らない（input も持たない）。
#     production の実測は姉妹ファイル db-readonly-check-cards-columns-production.yml が担う。
#     PLANETSCALE_DATABASE_URL は repo 直下ではなく **Environment secret** なので、
#     environment の宣言が無いと secret が解決せず DATABASE_URL が空になる
#     （planetscale-migrate.yml と同じ理由）。
#   - main / preview 以外の ref は job 条件と step 内の二重で拒否する
#     （feature branch のコードへ preview の secret を渡さない）。
#     main を許容するのは、既定ブランチへの着地だけで workflow_dispatch を成立させるため。
#     Environment は preview 固定なので、許可 ref のどちらから実行しても読むのは preview の
#     論理DBだけである（production の secret は provision されない）。
#   - セッション全体を読み取り専用にする（PGOPTIONS の default_transaction_read_only=on）。
#     誤って書き込み文が混ざっても DB 側で必ず失敗する。ワークフロー側の注意力に依存しない。
#     さらに**集計の前に接続先での実効 transaction_read_only を確認**し、on でなければ集計せず
#     失敗させる（オプション指定は「そう設定したつもり」にすぎないため）。
#   - 実行する SQL は本ファイルに固定で埋め込む。SQL を差し替える input は作らない。
#   - checkout しない（repo のコードを一切実行しない）。
#   - 公開ログを最小化する: 出力は information_schema の列メタデータ（列名・型・NULL可否）・
#     観測時刻・テーブル名に絞り、行データや payload（視聴者情報を含みうる）は出力しない。
#     DB 名（current_database）は出力しない。接続文字列も echo しない。
#
# 実行方法:
#   workflow_dispatch は workflow が既定ブランチ（main）に存在する必要がある。本ファイルは
#   main 着地用のコピーで、ref ガードが main / preview を許容する。
#     gh workflow run db-readonly-check-cards-columns.yml --ref main
#   production 側のコピー（db-readonly-check-cards-columns-production.yml）はガードが main のみで、
#   本ファイルとはガードの1行だけが異なる。SQL は完全に一致させ、一致は
#   tests/unit/db-readonly-check-cards-columns-workflow.test.ts が機械的に固定する。
#   実測結果は実行時刻（observed_at / run URL）とセットで Issue #954 に記録する。
name: "DB read-only check: cards columns (preview)"

on:
  workflow_dispatch: {}

# 同じ ref への連続実行はキューで待たせる（観測のみなのでキャンセルしない）。
concurrency:
  group: db-readonly-check-cards-columns-${{ github.ref }}
  cancel-in-progress: false

jobs:
  readonly-check:
    # workflow_dispatch は任意 ref を選べるため、job 開始前に main / preview 以外を拒否する。
    # main を許容するのは既定ブランチへの着地だけで dispatch を成立させるため。Environment は
    # preview 固定なので、どちらの許可 ref から実行しても読むのは preview の論理DBだけである。
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/preview'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # preview 固定。Environment secret の解決に必要（input では選ばせない）。
    environment: preview
    timeout-minutes: 5
    env:
      DATABASE_URL: ${{ secrets.PLANETSCALE_DATABASE_URL }}
      # 読み取り専用 + 暴走防止。default_transaction_read_only は psql ではなくサーバ側で効く。
      PGOPTIONS: "-c default_transaction_read_only=on -c statement_timeout=60000 -c lock_timeout=5000"
    steps:
      # job-level の if に加えた多重防御。将来 if が編集されても、main / preview 以外の
      # コードから DB secret を使わせない（feature branch を拒否する）。
      - name: Guard the target ref
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ] && [ "$GITHUB_REF" != "refs/heads/preview" ]; then
            echo "::error::the read-only check is only allowed from refs/heads/main or refs/heads/preview"
            exit 1
          fi

      # 読み取り結果の出所を記録する（secret は含まれない）。
      - name: Record provenance
        run: |
          echo "ref=$GITHUB_REF"
          echo "sha=$GITHUB_SHA"
          echo "run=$GITHUB_RUN_ID attempt=$GITHUB_RUN_ATTEMPT"

      # PGOPTIONS の指定は「そう設定したつもり」にすぎないため、接続先での**実効値**を確認する。
      # ここで on を確認できた場合にだけ観測へ進む（読み取り専用の強制はサーバ側で効く）。
      - name: Verify the session is read-only before aggregating
        run: |
          read_only=$(psql -X -qAt -v ON_ERROR_STOP=1 -d "$DATABASE_URL" -c "SHOW transaction_read_only")
          echo "transaction_read_only=$read_only"
          if [ "$read_only" != "on" ]; then
            echo "::error::expected transaction_read_only=on (PGOPTIONS default_transaction_read_only) but got '$read_only'"
            exit 1
          fi

      # Issue #954 の対象4列の実在を確認する。
      # - 「対象4列の実在」SELECT で列名・型・NULL可否を出力する（メタデータのみ）。
      # - 「欠落列」SELECT は 4列を左辺に固定列挙して欠落だけを明示する。0行なら全列実在。
      #   cards テーブル自体が無い場合は4列全欠として現れる（to_regclass 行で判別する）。
      # この SQL は production 用 (db-readonly-check-cards-columns-production.yml) と
      # **同一**に保つ。片方だけ直すと、環境ごとの実測根拠が乖離するため、一致は契約テスト
      # （tests/unit/db-readonly-check-cards-columns-workflow.test.ts）が固定する。
      - name: Check cards columns existence (read-only)
        run: |
          psql -X -v ON_ERROR_STOP=1 -d "$DATABASE_URL" <<'SQL'
          \pset pager off
          \echo ==== observation point (この実行時点の値) ====
          SELECT now() AS observed_at, current_setting('transaction_read_only') AS transaction_read_only;

          \echo ==== cards テーブルの存在（存在しない場合は以降が全件欠落として現れる） ====
          SELECT to_regclass('public.cards') AS cards_table;

          \echo ==== 対象4列の実在（Issue #954） ====
          SELECT column_name, data_type, is_nullable
          FROM information_schema.columns
          WHERE table_schema = 'public' AND table_name = 'cards'
            AND column_name IN ('card_number', 'max_issuance_count', 'collection_name', 'image_padding_color')
          ORDER BY column_name;

          \echo ==== 対象4列のうち欠落しているもの（0行なら全列実在） ====
          SELECT t.name AS target_column
          FROM (VALUES ('card_number'), ('max_issuance_count'), ('collection_name'), ('image_padding_color')) AS t(name)
          WHERE NOT EXISTS (
            SELECT 1
            FROM information_schema.columns c
            WHERE c.table_schema = 'public' AND c.table_name = 'cards' AND c.column_name = t.name
          );
          SQL
