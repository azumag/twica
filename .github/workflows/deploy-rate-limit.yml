name: Deploy Rate Limit Worker

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type 'deploy' to confirm deployment of the rate-limit preview Worker"
        required: true
        type: string

jobs:
  deploy:
    if: ${{ github.event.inputs.confirm == 'deploy' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment: preview

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Deploy rate-limit preview Worker
        run: npm run rate-limit:deploy:preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
