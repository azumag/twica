# Public read-only WebSocket edge + private signed publisher for OBS overlays.
# The application remains functional when this Worker is absent because
# PlanetScale HTTP polling is always retained as the recovery transport.
name = "twica-overlay-realtime"
main = "src/index.ts"
# Use the latest completed UTC date. A JST calendar date can still be "future"
# to Cloudflare's API around midnight and is rejected with code 10021.
compatibility_date = "2026-07-23"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[vars]
MAX_ROOM_CONNECTIONS = "100"
MAX_ROOM_CONNECTS_PER_MINUTE = "60"
MAX_CLIENT_CONNECTS_PER_MINUTE = "10"
MAX_ROOM_PUBLISHES_PER_MINUTE = "120"

[[durable_objects.bindings]]
name = "OVERLAY_ROOMS"
class_name = "OverlayRoom"

# #1114: single global presence registry for the /live estimated live-channel
# count. Rooms report through this internal DO binding only; the public router
# exposes just the signed presence-count read.
[[durable_objects.bindings]]
name = "PRESENCE_REGISTRY"
class_name = "PresenceRegistry"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["OverlayRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["PresenceRegistry"]

# Required secrets (set with `wrangler secret put` and never commit):
# - OVERLAY_REALTIME_PUBLISH_SECRET
# - OVERLAY_REALTIME_MODE
# - OVERLAY_REALTIME_STREAMER_ALLOWLIST

[env.preview]
name = "twica-overlay-realtime-preview"

[env.preview.observability]
enabled = true

[env.preview.vars]
MAX_ROOM_CONNECTIONS = "100"
MAX_ROOM_CONNECTS_PER_MINUTE = "60"
MAX_CLIENT_CONNECTS_PER_MINUTE = "10"
MAX_ROOM_PUBLISHES_PER_MINUTE = "120"

[[env.preview.durable_objects.bindings]]
name = "OVERLAY_ROOMS"
class_name = "OverlayRoom"

[[env.preview.durable_objects.bindings]]
name = "PRESENCE_REGISTRY"
class_name = "PresenceRegistry"

[[env.preview.migrations]]
tag = "v1"
new_sqlite_classes = ["OverlayRoom"]

[[env.preview.migrations]]
tag = "v2"
new_sqlite_classes = ["PresenceRegistry"]
