# Reporter Cron Worker
# レポーター定期実行Worker
#
# Supabase から未処理レコードを取得し GitHub Issue を自動作成する。
#   - errors テーブル: 未処理エラー（Tail Workers 有料の無料代替）
#   - support_inquiries テーブル: 新規問い合わせの通知（Issue #633）
# 同一の secrets・cron・デプロイを共有するため単一 Worker に集約している。
#
# See: https://github.com/azumag/twica/issues/239 (errors)
#      https://github.com/azumag/twica/issues/633 (inquiries)

name = "twica-error-reporter"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# 5分ごとに実行（Free プランで最大3トリガー/worker まで無料）
[triggers]
crons = ["*/5 * * * *"]

# 公開可能な変数（wrangler.toml に直接記載）
[vars]
GITHUB_REPO_OWNER = "azumag"
GITHUB_REPO_NAME = "twica"

# EventSub 退避 backlog 監視（Issue #695 の代替、KVベース部分改善の1項目目）用。
# root wrangler.toml の RATE_LIMIT_KV と同じ namespace を binding 名を揃えて共用する
# （src/lib/maintenance/eventsub-park.ts が退避先として使っているのと同じ namespace）。
# id / preview_id を変更する場合は root wrangler.toml 側も必ず揃えること。
# このワーカーは list() のみ使用し、値の読み書き（get/put/delete）は行わない。
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "2dadcd9aa89b466d9c860a8930d458fa"
preview_id = "6604c73cdb474d6a8a50b8afd4076d5f"

# 機密変数（Cloudflare Dashboard または wrangler secret put で設定）
# Required secrets:
# - SUPABASE_URL: Supabase プロジェクト URL (e.g. https://xxx.supabase.co)
# - SUPABASE_SECRET_KEY: Supabase secret キー
# - SUPABASE_SERVICE_ROLE_KEY: legacy Supabase service role キー
# - GITHUB_TOKEN: GitHub Fine-grained PAT (scopes: Issues read/write)
