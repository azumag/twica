# Reporter Cron Worker
# レポーター定期実行Worker
#
# errors/support_inquiries テーブルから未処理レコードを取得し GitHub Issue を
# 自動作成する。
#   - errors テーブル: 未処理エラー（Tail Workers 有料の無料代替）
#   - support_inquiries テーブル: 新規問い合わせの通知（Issue #633）
# 同一の secrets・cron・デプロイを共有するため単一 Worker に集約している。
#
# DB アクセス (#711 C, 2026-07): PostgREST（Supabase REST API）の fetch 直叩きから
# Hyperdrive 経由の postgres.js 直結へ移行済み。下記 [[hyperdrive]] 参照。
#
# See: https://github.com/azumag/twica/issues/239 (errors)
#      https://github.com/azumag/twica/issues/633 (inquiries)
#      https://github.com/azumag/twica/issues/711 (Phase2 DB移行, C項)

name = "twica-error-reporter"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# 2種類の独立した Cron トリガー（Free プランで最大3トリガー/worker まで無料、
# 2個使ってもまだ1個分の余裕がある）:
#   - */5 * * * *  : 既存トリガー。errors/inquiries/backlog監視の3処理
#   - */20 * * * * : EventSub 退避 backlog 自動ドレイン（Issue #695 の代替、
#     KVベース部分改善の2項目目）専用トリガー。5分毎ほどの高頻度は不要
#     （HTTP経由でアプリ本体の書き込み系APIを叩く処理のため）。
#     src/index.ts の EVENTSUB_AUTO_DRAIN_CRON 定数と完全に一致させること
#     （scheduled() がこの文字列で分岐する）。
[triggers]
crons = ["*/5 * * * *", "*/20 * * * *"]

# 公開可能な変数（wrangler.toml に直接記載）
[vars]
GITHUB_REPO_OWNER = "azumag"
GITHUB_REPO_NAME = "twica"

# EventSub 退避 backlog 自動ドレイン（KVベース部分改善の2項目目）が
# GET /api/maintenance-status・POST /api/admin/eventsub-replay を叩く対象
# アプリのベースURL。機密ではないため公開変数でよい。
# prod/preview 両方を対象にする理由は src/index.ts の Env 型
# （APP_BASE_URL_PROD/PREVIEW フィールド）のコメントを参照。
APP_BASE_URL_PROD = "https://twica.bluemoon.works"
APP_BASE_URL_PREVIEW = "https://twica-preview.tsubasa-azumagakito.workers.dev"

# EventSub 退避 backlog 監視（Issue #695 の代替、KVベース部分改善の1項目目）用。
# root wrangler.toml の RATE_LIMIT_KV と同じ namespace を binding 名を揃えて共用する
# （src/lib/maintenance/eventsub-park.ts が退避先として使っているのと同じ namespace）。
# id / preview_id を変更する場合は root wrangler.toml 側も必ず揃えること。
# このワーカーは list() のみ使用し、値の読み書き（get/put/delete）は行わない。
# 2項目目（自動ドレイン）はこのバインディングを使わない（HTTP経由でアプリ本体の
# API を叩く設計のため。理由は src/index.ts の processEventSubParkAutoDrain
# セクション冒頭コメント参照）。
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "2dadcd9aa89b466d9c860a8930d458fa"
preview_id = "6604c73cdb474d6a8a50b8afd4076d5f"

# ============================================================
# Hyperdrive binding for direct Postgres access (#711 C)
# Postgres 直結アクセス用 Hyperdrive バインディング (#711 C)
# ============================================================
#
# errors/support_inquiries への DB アクセスを PostgREST（fetch 直叩き）から
# postgres.js 直結へ移行した際に追加。src/index.ts の createReporterDbClient が
# 使用する。
#
# production はルートアプリと同じ PlanetScale Hyperdrive config ID を共有する。
# これにより errors/support_inquiries もアプリ本体と必ず同じ正本DBを参照し、
# 片方だけ別接続先へずれる構成を防ぐ。旧DB binding へのフォールバックは持たない。
#
# --caching-disabled 等の作成手順・localConnectionString の用途は
# ルート wrangler.toml の [[hyperdrive]] コメント（本ファイルと同じ根拠）を参照。
[[hyperdrive]]
binding = "HYPERDRIVE_PLANETSCALE"
id = "1dc2ec4d087e41a6931e8e18944c1fd2"
localConnectionString = "postgres://user:password@localhost:5432/postgres"

# preview 環境用 Hyperdrive バインディング。
# このワーカー自体は本番のみデプロイする運用（.github/workflows/
# deploy-cloudflare.yml の「Error Reporter Cron Worker のデプロイ（本番のみ）」
# コメント参照）だが、オーナー判断により preview 用 binding もあわせて用意する
# （issue #711 比較コメント §4-4 の未決事項への回答）。`wrangler dev`
# （`--env preview` 指定時）や、将来 preview 環境へのデプロイが必要になった
# 場合に備える。id はルート wrangler.toml の [env.preview.hyperdrive] と同じ
# reporter の preview 検証用 config を指す。ルートアプリの preview configとは
# IDが異なるため、この環境を実運用へ昇格させる場合は接続先の一致を再検証する。
#
# m-2 (Fableレビュー指摘) 影響範囲の明記:
# 1. この [env.preview] を追加したことで、CI（.github/workflows/
#    deploy-cloudflare.yml、`working-directory: workers/error-reporter` で
#    `npx wrangler deploy` を --env 無指定で実行）は「Multiple environments are
#    defined... but no target environment was specified」という警告を出す
#    ようになる（`npx wrangler@4.112.0 deploy --dry-run` で実測確認済み）。
#    これは単なる警告であり、--env 無指定時は明示的にトップレベル環境へ
#    デプロイされる（Cloudflare の既定挙動）ため、実際のデプロイ先
#    （本番 twica-error-reporter）は従来どおりで実害は無い。
# 2. `--env preview` を明示的に指定した場合（今日時点で誰も使っていないが将来
#    使う可能性に備え明記）: TOML の environment は「トップレベル設定を
#    継承」ではなく「キーごとに上書き」のため、[vars]（GITHUB_REPO_OWNER 等・
#    APP_BASE_URL_PROD/PREVIEW）と [[kv_namespaces]]（RATE_LIMIT_KV）は
#    [env.preview] 側に再宣言していない分だけ preview 実行時には存在しない
#    （`npx wrangler deploy --dry-run --env preview` で実測確認済み: bindings
#    一覧に HYPERDRIVE_PLANETSCALE のみが出力され、RATE_LIMIT_KV/vars は出ない）。
#    つまり --env preview は「Hyperdrive バインディングだけを検証できる縮退
#    モード」であり、errors/inquiries 以外の処理（backlog監視・自動ドレイン）を
#    preview で試すには [env.preview.vars] / [env.preview.kv_namespaces] の
#    再宣言が別途必要（本ワーカーは preview デプロイの予定が無いため未対応）。
[env.preview]

[[env.preview.hyperdrive]]
binding = "HYPERDRIVE_PLANETSCALE"
id = "1e3f6c4569bf4202a41c42711c878b86"
localConnectionString = "postgres://user:password@localhost:5432/postgres"

# 機密変数（Cloudflare Dashboard または wrangler secret put で設定）
# Required secrets:
# - GITHUB_TOKEN: GitHub Fine-grained PAT (scopes: Issues read/write)
#
# DB アクセスは上記 PlanetScale Hyperdrive binding のみを使用する。
# 旧 Supabase secrets は #708 の停止手順で削除する。
#
# EventSub 退避 backlog 自動ドレイン（2項目目）用の追加 secrets:
# - EVENTSUB_REPLAY_SECRET_PROD: 本番アプリ（twica）の EVENTSUB_REPLAY_SECRET と
#   同じ値。本番アプリ側は docs/history/migration/DB_PHASE2_RUNBOOK.md 4.3節のとおり
#   `wrangler versions secret put EVENTSUB_REPLAY_SECRET` で設定済みなので、
#   その値をそのままこのワーカーの EVENTSUB_REPLAY_SECRET_PROD にも
#   `wrangler secret put EVENTSUB_REPLAY_SECRET_PROD` で設定すること
#   （新しい値を生成しない。値を変えると本番アプリ側との認証が一致しなくなる）。
# - EVENTSUB_REPLAY_SECRET_PREVIEW: preview アプリ（twica-preview）の
#   EVENTSUB_REPLAY_SECRET と同じ値。上記と同様に既存の preview 側の値を
#   `wrangler secret put EVENTSUB_REPLAY_SECRET_PREVIEW` で設定すること。
# どちらも未設定の場合、該当ターゲットへの自動ドレインのみを安全にスキップし
# 警告ログを出す（他方のターゲットや既存の errors/inquiries/backlog監視には
# 影響しない）。デプロイ後にオーナーが設定する想定。
#
# EventSub サブスクリプション健全性監視（Issue #540）用の追加 secrets:
# - EVENTSUB_HEALTH_SECRET_PROD: 本番アプリ（twica）の EVENTSUB_HEALTH_SECRET と
#   同じ値を `wrangler secret put EVENTSUB_HEALTH_SECRET_PROD` で設定すること
#   （EVENTSUB_REPLAY_SECRET_PROD と同じ理由。新しい値を生成しない）。
# - EVENTSUB_HEALTH_SECRET_PREVIEW: preview アプリ（twica-preview）の
#   EVENTSUB_HEALTH_SECRET と同じ値。上記と同様に設定すること。
# どちらも未設定の場合、該当ターゲットへのヘルスチェックのみを安全にスキップし
# 警告ログを出す。デプロイ後にオーナーが設定する想定。
